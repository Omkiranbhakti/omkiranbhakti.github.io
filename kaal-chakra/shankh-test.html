<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>शंख चुनें — काल-चक्र</title>
<style>body{margin:0;background:#120b06;color:#efe2cc;font:17px/1.6 system-ui,sans-serif}main{max-width:560px;margin:auto;padding:16px}h1{color:#f5c66b;font-size:1.3rem}
.row{display:flex;flex-direction:column;gap:12px}button{font:600 1.05rem system-ui;border:1px solid #f5c66b;background:#2a1c10;color:#fbe7c0;border-radius:14px;padding:14px 18px;text-align:left;cursor:pointer}button.on{background:#f5c66b;color:#120b06}</style></head>
<body><main><h1>🐚 शंख चुनें</h1><p>हेडफ़ोन लगाकर सुनें, जो अच्छा लगे उसका अक्षर (SA / SB / SC / SD) Claude को लिख दें। दोबारा दबाने पर रुक जाएगा।</p><div class="row" id="r"></div>
<p style="opacity:.75;font-size:.9rem">स्रोत: Pixabay (Pixabay Content License — मुफ़्त, व्यावसायिक उपयोग की अनुमति)</p></main>
<script>
const O=[['sa','SA — एक शंखनाद (मंदिर की गूँज के साथ)'],['sb','SB — तीन शंखनाद (गूँज के साथ)'],['sc','SC — गहरा शंख (अपनी प्राकृतिक गूँज)'],['sd','SD — छोटा शंखनाद (गूँज के साथ)']];
let a=null,cb=null;O.forEach(([k,t])=>{const b=document.createElement('button');b.textContent='▶ '+t;b.onclick=()=>{if(a){a.pause();cb.classList.remove('on');if(cb===b){a=null;return}}a=new Audio('snd/test/'+k+'.mp3');a.play();cb=b;b.classList.add('on');a.onended=()=>b.classList.remove('on')};document.getElementById('r').appendChild(b)});
</script></body></html>
