[830,'t','तिरुमला के श्री वेंकटेश्वर','तिरुमला (आंध्र प्रदेश)','सात पहाड़ियों पर विराजमान भगवान वेंकटेश्वर। यहाँ के सबसे पुराने शिलालेख नौवीं सदी के आसपास के मिलते हैं।','तिरुपति बालाजी','tirupati balaji',"Venkateswara Temple, Tirumala"],
[850,'s','माणिक्कवाचकर और तिरुवाचकम्','मदुरै','घोड़े खरीदने को मिला राजकोष शिव-मंदिर में लगा देने वाले मंत्री माणिक्कवाचकर ने तिरुवाचकम् रचा, जिसे पढ़कर पत्थर दिल भी पिघल जाए।','तिरुवाचकम्','manikkavasagar thiruvasagam',"Manikkavacakar"],
[850,'s','नम्मालवार और तिरुवायमोऴि','तिरुक्कुरुकूर (आऴ्वार तिरुनगरी)','सोलह वर्ष इमली के पेड़ की खोह में मौन बैठे नम्मालवार ने तिरुवायमोऴि के 1,102 पद गाए, जिसे तमिल वेद कहा जाता है।','नम्मालवार','nammalvar thiruvaimozhi',"Nammalvar"],
[950,'t','चिदंबरम के नटराज','चिदंबरम (तमिलनाडु)','भगवान शिव के आनंद तांडव का धाम। चोल राजाओं ने इसकी छत पर सोना चढ़वाया; यहाँ शिव आकाश तत्व के रूप में पूजे जाते हैं।','नटराज','chidambaram nataraja',"Thillai Nataraja Temple, Chidambaram"],
[990,'s','अभिनवगुप्त और कश्मीर शैव दर्शन','श्रीनगर (कश्मीर)','कश्मीर के महान आचार्य अभिनवगुप्त ने तंत्रालोक रचा और शैव दर्शन, सौंदर्य-शास्त्र और नाट्यशास्त्र की व्याख्या को नई ऊँचाई दी।','शिव','abhinavagupta',"Abhinavagupta"],
[1000,'t','ओंकारेश्वर ज्योतिर्लिंग','मांधाता द्वीप (मध्य प्रदेश)','नर्मदा के बीच ॐ आकार के द्वीप पर बारह ज्योतिर्लिंगों में से एक ओंकारेश्वर विराजते हैं।','शिव','omkareshwar',"Omkareshwar"],
[1000,'t','अंबाजी शक्तिपीठ','अंबाजी (बनासकांठा, गुजरात)','अरासुर पर्वत पर माँ अंबा का धाम, जहाँ गर्भगृह में मूर्ति नहीं, श्री विसा यंत्र की पूजा होती है।','अंबाजी','ambaji shaktipeeth',"Ambaji Temple"],
[1000,'t','पावागढ़ की महाकाली','पावागढ़ (पंचमहाल, गुजरात)','चंपानेर के ऊपर पावागढ़ पहाड़ी पर कालिका माता का प्राचीन शक्तिपीठ; 2022 में पाँच सदियों बाद शिखर पर फिर ध्वजा फहराई गई।','पावागढ़','pavagadh kalika',"Kalika Mata Temple, Pavagadh"],
[1000,'t','हिंगलाज माता','हिंगोल (बलूचिस्तान, पाकिस्तान)','मकरान के रेगिस्तानी पहाड़ों की गुफा में बसा शक्तिपीठ, जहाँ सती का ब्रह्मरंध्र गिरा माना जाता है; हिंदू और स्थानीय मुसलमान दोनों इसे नानी मंदिर कहकर पूजते हैं।','हिंगलाज','hinglaj mata',"Hinglaj Mata"],
[1000,'t','परशुराम कुंड','लोहित (अरुणाचल प्रदेश)','लोहित नदी के इस कुंड में स्नान से परशुराम का मातृहत्या का पाप धुला माना जाता है; मकर संक्रांति पर पूर्वोत्तर का बड़ा मेला।','परशुराम कुंड','parshuram kund',"Parshuram Kund"],
[1010,'t','तंजावुर का बृहदेश्वर मंदिर','तंजावुर (तमिलनाडु)','चोल सम्राट राजराज प्रथम ने 1010 ई. में यह विशाल शिव मंदिर बनवाया। इसका शिखर दक्षिण भारत के सबसे ऊँचे शिखरों में है।','शिव','brihadeeswara',"Brihadisvara Temple, Thanjavur"],
[1017,'s','रामानुजाचार्य — विशिष्टाद्वैत','श्रीपेरुम्बुदूर','रामानुजाचार्य ने विशिष्टाद्वैत दर्शन दिया और भक्ति का द्वार सबके लिए खोला। श्रीरंगम उनका मुख्य केंद्र रहा।','रामानुजाचार्य','ramanujacharya',"Ramanuja"],
[1026,'t','मोढेरा का सूर्य मंदिर','मोढेरा (गुजरात)','चालुक्य राजा भीमदेव प्रथम के समय 1026 ई. में बना सूर्य मंदिर, जिसके आगे सीढ़ियों वाला सुंदर सूर्य कुंड है।','सूर्य देव','modhera',"Sun Temple, Modhera"],
[1030,'t','खजुराहो का कंदरिया महादेव','खजुराहो (मध्य प्रदेश)','चंदेल राजाओं के समय बना यह शिव मंदिर नागर शैली का श्रेष्ठ उदाहरण है, जिसका शिखर कैलाश पर्वत जैसा उठता है।','शिव','kandariya mahadeva',"Kandariya Mahadeva Temple"],
[1050,'s','गुरु गोरखनाथ और नाथ पंथ','गोरखपुर','मत्स्येंद्रनाथ के शिष्य गोरखनाथ ने हठयोग और नाथ परंपरा को पूरे भारत में फैलाया।','गोरखनाथ','gorakhnath',"Gorakhnath"],
[1087,'t','सिंहाचलम के वराह-नृसिंह','सिंहाचलम (विशाखापत्तनम)','पहाड़ी पर बसे वराह-लक्ष्मी-नृसिंह साल भर चंदन के लेप में ढके रहते हैं; उनके असली दर्शन केवल अक्षय तृतीया के चंदनोत्सव पर होते हैं।','सिंहाचलम','simhachalam narasimha',"Simhachalam"],
[1100,'t','भुवनेश्वर का लिंगराज मंदिर','भुवनेश्वर (ओडिशा)','ग्यारहवीं सदी में बना कलिंग शैली का भव्य मंदिर, जहाँ हरिहर — शिव और विष्णु का एक रूप — पूजे जाते हैं।','लिंगराज','lingaraj',"Lingaraja Temple"],
[1134,'s','बसवण्णा — वचन और अनुभव मंडप','कल्याण (कर्नाटक)','बारहवीं सदी के शिवभक्त बसवण्णा ने कन्नड़ वचनों से जात-पाँत का विरोध किया और अनुभव मंडप में सबको बराबर बैठाया।','बसवण्णा','basavanna',"Basava"],
[1135,'t','पुरी का श्री जगन्नाथ मंदिर','पुरी (ओडिशा)','गंग राजा अनंतवर्मन चोडगंग के समय बना वर्तमान मंदिर चार धामों में एक है। यहाँ की रथयात्रा विश्व-प्रसिद्ध है।','जगन्नाथ','jagannath puri',"Jagannath Temple, Puri"],
[1148,'t','अमरनाथ गुफा','अमरनाथ (कश्मीर)','हिमालय की गुफा में बर्फ़ से बनने वाले शिवलिंग के दर्शन की यात्रा। कल्हण की राजतरंगिणी में अमरेश्वर तीर्थ का उल्लेख है।','शिव','amarnath',"Amarnath Temple"],
[1160,'s','अक्का महादेवी','कर्नाटक, श्रीशैलम','चन्नमल्लिकार्जुन (शिव) को ही पति मानने वाली अक्का महादेवी ने राजमहल छोड़ा और कल्याण के अनुभव मंडप तक पहुँचीं।','अक्का महादेवी','akka mahadevi',"Akka Mahadevi"],
[1170,'t','रामेश्वरम का रामनाथस्वामी मंदिर','रामेश्वरम (तमिलनाडु)','श्रीराम द्वारा स्थापित शिवलिंग की परंपरा वाला ज्योतिर्लिंग। इसके लंबे गलियारे बारहवीं सदी के बाद बने।','रामेश्वरम','rameswaram',"Ramanathaswamy Temple"],
[1170,'s','जयदेव और गीत गोविंद','केंदुली / पुरी','कवि जयदेव ने संस्कृत में गीत गोविंद रचा, जिसके पद आज भी पुरी के जगन्नाथ मंदिर में गाए जाते हैं।','गीत गोविंद','jayadeva',"Jayadeva"],
[1200,'t','पंढरपुर के श्री विठ्ठल','पंढरपुर (महाराष्ट्र)','भक्त पुंडलीक के लिए ईंट पर खड़े विठोबा। बारहवीं-तेरहवीं सदी के शिलालेख मिलते हैं; आषाढ़ी एकादशी पर लाखों वारकरी आते हैं।','विठ्ठल','pandharpur',"Vithoba Temple, Pandharpur"],
[1200,'t','तुलजापुर की तुलजा भवानी','तुलजापुर (धाराशिव, महाराष्ट्र)','छत्रपति शिवाजी की कुलदेवी; परंपरा के अनुसार देवी ने उन्हें भवानी तलवार का आशीर्वाद दिया।','तुलजा भवानी','tulja bhavani',"Tulja Bhavani Temple"],
[1200,'t','मैहर की माँ शारदा','मैहर (सतना, मध्य प्रदेश)','त्रिकूट पहाड़ी की 1,063 सीढ़ियों के ऊपर माँ शारदा; लोक-कथा है कि आल्हा आज भी भोर में सबसे पहले पूजा कर जाते हैं।','मैहर शारदा','maihar sharda mata',"Maihar Sharda Temple"],
[1200,'t','जेजुरी के खंडोबा','जेजुरी (पुणे, महाराष्ट्र)','मल्हारी मार्तंड खंडोबा, शिव का लोक-रूप — भंडारे (हल्दी) की पीली बौछार में येळकोट येळकोट जय मल्हार का जयघोष।','खंडोबा','jejuri khandoba',"Khandoba"],
[1238,'s','मध्वाचार्य — द्वैत वेदांत','उडुपी','मध्वाचार्य ने द्वैत दर्शन दिया और उडुपी में बालकृष्ण की मूर्ति स्थापित की, जो आज भी पूजी जाती है।','उडुपी कृष्ण','madhvacharya',"Madhvacharya"],
[1250,'t','कोणार्क का सूर्य मंदिर','कोणार्क (ओडिशा)','गंग राजा नरसिंहदेव प्रथम ने सूर्य देव के रथ के रूप में यह मंदिर बनवाया, जिसमें पत्थर के बारह जोड़ी पहिये हैं।','सूर्य देव','konark',"Konark Sun Temple"],
[1250,'s','निंबार्काचार्य और राधा-कृष्ण उपासना','वृंदावन','निंबार्काचार्य ने द्वैताद्वैत दर्शन दिया और राधा-कृष्ण की युगल उपासना पर ज़ोर दिया।','राधा कृष्ण','nimbarka',"Nimbarka"],
[1250,'t','उडुपी का श्रीकृष्ण मठ','उडुपी (कर्नाटक)','मध्वाचार्य ने समुद्र से मिली मिट्टी की गठरी में छिपी बालकृष्ण की मूर्ति उडुपी में स्थापित की।','कृष्ण','udupi krishna',"Udupi Sri Krishna Matha"],
[1268,'s','वेदांत देशिक','कांचीपुरम','रामानुज परंपरा के महान आचार्य वेदांत देशिक ने सौ से ज़्यादा ग्रंथ रचे और श्रीवैष्णव दर्शन को दृढ़ किया।','विष्णु','vedanta desika',"Vedanta Desika"],
[1270,'s','संत नामदेव','पंढरपुर','महाराष्ट्र के वारकरी संत नामदेव ने विठ्ठल की भक्ति के अभंग गाए। उनके पद गुरु ग्रंथ साहिब में भी हैं।','विठ्ठल','namdev',"Namdev"],
[1290,'s','संत ज्ञानेश्वर और ज्ञानेश्वरी','नेवासा (महाराष्ट्र)','सोलह वर्ष की आयु में संत ज्ञानेश्वर ने गीता पर मराठी में ज्ञानेश्वरी लिखी और आलंदी में समाधि ली।','ज्ञानेश्वरी','dnyaneshwar',"Dnyaneshwar"],
[1299,'s','स्वामी रामानंद','प्रयाग / काशी','रामानंद ने राम-भक्ति का द्वार सबके लिए खोला। कबीर, रविदास और अनेक संत उनकी परंपरा से जुड़े माने जाते हैं।','रामानंदी','ramananda',"Ramananda"],
[1300,'t','माता वैष्णो देवी की गुफा','त्रिकूट पर्वत (जम्मू)','त्रिकूट पर्वत की पवित्र गुफा में माँ तीन पिंडियों — महाकाली, महालक्ष्मी, महासरस्वती — के रूप में विराजती हैं।','वैष्णो देवी','vaishno devi',"Vaishno Devi Temple"],
[1300,'s','संत चोखामेला','पंढरपुर','महार समाज में जन्मे चोखामेला विठ्ठल के ऐसे भक्त थे जिनके अभंग आज भी गाए जाते हैं। उनकी समाधि मंदिर की सीढ़ी पर है।','विठ्ठल','chokhamela',"Chokhamela"],
[1300,'s','जनाबाई, मुक्ताबाई और सोयराबाई','महाराष्ट्र','नामदेव की दासी जनाबाई, ज्ञानेश्वर की बहन मुक्ताबाई और चोखामेला की पत्नी सोयराबाई — मराठी की पहली संत-कवयित्रियाँ।','जनाबाई','janabai muktabai',"Janabai"],
[1300,'t','नागेश्वर ज्योतिर्लिंग, द्वारका','दारुकावन (द्वारका, गुजरात)','सुप्रिय वैश्य की रक्षा के लिए दारुका राक्षसी के वन में प्रकट हुए नागेश्वर — द्वारका के पास का ज्योतिर्लिंग।','नागेश्वर','nageshwar jyotirlinga',"Nageshwar Jyotirlinga"],
[1320,'s','लल्लेश्वरी — लल्ल देद','कश्मीर','कश्मीर की शिव-योगिनी लल्ल देद ने कश्मीरी में वाख रचे, जो आज भी वहाँ के घर-घर में बोले जाते हैं।','लल्ल देद','lal ded',"Lalleshwari"],
[1336,'s','विद्यारण्य और विजयनगर','हम्पी','श्रृंगेरी के आचार्य विद्यारण्य की प्रेरणा से हरिहर और बुक्क ने विजयनगर साम्राज्य की नींव रखी।','विद्यारण्य','vidyaranya',"Vidyaranya"],
[1350,'t','द्वादश ज्योतिर्लिंग','अखिल भारत','शिव पुराण में बारह ज्योतिर्लिंगों की सूची है: जहाँ शिव अनंत प्रकाश-स्तंभ के रूप में प्रकट हुए — सोमनाथ से रामेश्वरम तक।','12 ज्योतिर्लिंग','dwadash jyotirlinga',"Jyotirlinga"],
[1350,'t','51 शक्तिपीठ','अखिल भारत और पड़ोसी देश','सती के अंग जहाँ-जहाँ गिरे, वहाँ शक्तिपीठ बने — कश्मीर से कन्याकुमारी और हिंगलाज से कामाख्या तक।','शक्तिपीठ','51 shaktipeeth',"Shakti Peetha"],
[1350,'t','पुष्कर का ब्रह्मा मंदिर','पुष्कर (अजमेर, राजस्थान)','सृष्टिकर्ता ब्रह्मा के गिने-चुने मंदिरों में सबसे प्रसिद्ध; पुष्कर सरोवर ब्रह्मा के हाथ से गिरे कमल से बना माना जाता है।','पुष्कर','pushkar brahma',"Jagatpita Brahma Mandir"],
[1371,'t','श्रीरंगम में रंगनाथ की वापसी','श्रीरंगम (तमिलनाडु)','आक्रमणों के समय छिपाई गई रंगनाथ की मूर्ति 1371 ई. के आसपास फिर श्रीरंगम लौटी। यह दुनिया के सबसे बड़े चालू मंदिर-परिसरों में है।','रंगनाथ','srirangam',"Ranganathaswamy Temple, Srirangam"],
[1398,'t','अहोबिलम के नव नृसिंह','अहोबिलम (नंद्याल, आंध्र प्रदेश)','जहाँ भगवान नृसिंह ने खंभे से प्रकट होकर हिरण्यकशिपु का वध किया माना जाता है; नल्लमला की पहाड़ियों में नृसिंह के नौ मंदिर।','अहोबिलम','ahobilam nava narasimha',"Ahobilam"],
[1400,'t','श्रीशैलम के मल्लिकार्जुन','श्रीशैलम (आंध्र प्रदेश)','ज्योतिर्लिंग भी और शक्तिपीठ (भ्रमरांबा) भी। विजयनगर काल में मंदिर का बड़ा विस्तार हुआ।','मल्लिकार्जुन','srisailam',"Mallikarjuna Temple, Srisailam"],
[1408,'s','अन्नमाचार्य','तालपाका (आंध्र प्रदेश)','तिरुमला के वेंकटेश्वर के भक्त अन्नमाचार्य ने लगभग 32,000 संकीर्तन रचे — तेलुगु पद-कविता के पितामह।','अन्नमाचार्य','annamacharya',"Annamacharya"],
[1414,'s','नरसिंह मेहता','जूनागढ़ (गुजरात)','गुजराती के आदिकवि नरसिंह मेहता ने कृष्ण-भक्ति के पद रचे। गांधी जी का प्रिय भजन वैष्णव जन तो उन्हीं का है।','वैष्णव जन तो','narsinh mehta',"Narsinh Mehta"],
[1440,'s','संत कबीर','काशी','काशी के जुलाहे संत कबीर ने दोहों से पाखंड पर चोट की और निर्गुण राम की भक्ति सिखाई।','कबीर के दोहे','kabir',"Kabir"],
[1449,'s','श्रीमंत शंकरदेव','असम','असम के संत शंकरदेव ने एकशरण नाम धर्म, नामघर, बरगीत और अंकिया नाट से पूरे असम को कृष्ण-भक्ति से जोड़ा।','शंकरदेव','sankardev',"Srimanta Sankardev"],
[1450,'s','संत रविदास','काशी','काशी के संत रविदास ने कहा — मन चंगा तो कठौती में गंगा। मीराबाई उन्हें अपना गुरु मानती थीं।','रविदास','ravidas',"Ravidas"],
[1450,'s','कृत्तिवासी रामायण','फुलिया (बंगाल)','कृत्तिवास ओझा ने रामायण को बांग्ला पयार छंद में गाने लायक रूप दिया — बंगाल के घर-घर की रामकथा।','कृत्तिवास','krittivasi ramayan',"Krittivasi Ramayan"],
[1459,'t','रामदेवरा — बाबा रामदेव','रामदेवरा (जैसलमेर, राजस्थान)','तंवर राजपूत संत बाबा रामदेव ने 1459 में यहाँ जीवित समाधि ली; हिंदू उन्हें कृष्ण का अवतार और मुसलमान रामसा पीर मानते हैं।','बाबा रामदेव','ramdevra baba ramdev',"Ramdev Pir"],
[1478,'s','सूरदास','ब्रज','अष्टछाप के कवि सूरदास ने सूरसागर में बाल-कृष्ण की लीलाएँ ऐसे गाईं, मानो आँखों से देखी हों।','सूरदास','surdas',"Surdas"],
[1479,'s','वल्लभाचार्य — पुष्टिमार्ग','चंपारण्य (छत्तीसगढ़)','वल्लभाचार्य ने शुद्धाद्वैत और पुष्टिमार्ग दिया, जिसमें भगवान की कृपा ही सब कुछ है। श्रीनाथजी इसी परंपरा के आराध्य हैं।','श्रीनाथजी','vallabhacharya',"Vallabha"],
[1484,'s','पुरंदर दास','कर्नाटक','कर्नाटक संगीत के पितामह पुरंदर दास ने हज़ारों कन्नड़ भजन रचे और संगीत सीखने का क्रम बनाया।','पुरंदर दास','purandara dasa',"Purandara Dasa"],
[1486,'s','चैतन्य महाप्रभु','नवद्वीप (बंगाल)','नवद्वीप में जन्मे चैतन्य महाप्रभु ने हरे कृष्ण महामंत्र का संकीर्तन घर-घर पहुँचाया।','हरे कृष्ण','chaitanya mahaprabhu',"Chaitanya Mahaprabhu"],
[1498,'s','मीराबाई','मेड़ता से द्वारका','राजपूत रानी मीराबाई ने गिरधर गोपाल को ही अपना सब माना और महल छोड़कर भक्ति के पद गाए।','मीरा के भजन','meera bai',"Meera"],
[1500,'t','द्वारकाधीश मंदिर','द्वारका (गुजरात)','चार धामों में एक। परंपरा कहती है कि श्रीकृष्ण के पौत्र वज्रनाभ ने पहला मंदिर बनवाया; आज का मंदिर बाद की सदियों का है।','द्वारकाधीश','dwarkadhish',"Dwarkadhish Temple"],
[1509,'s','कनकदास','कागिनेले (कर्नाटक)','कुरुबा समाज के संत कनकदास की भक्ति से उडुपी में श्रीकृष्ण की मूर्ति उनकी ओर घूम गई — वह खिड़की आज कनकनकिंडी कहलाती है।','कनकदास','kanakadasa',"Kanaka Dasa"],
[1510,'t','हम्पी का विरूपाक्ष मंदिर','हम्पी (कर्नाटक)','विजयनगर की राजधानी का प्रमुख शिव मंदिर। 1510 ई. में राजा कृष्णदेवराय ने इसका ऊँचा गोपुरम बनवाया।','विरूपाक्ष','virupaksha hampi',"Virupaksha Temple, Hampi"],
[1520,'t','माजुली के सत्र','माजुली (असम)','ब्रह्मपुत्र के सबसे बड़े नदी-द्वीप पर श्रीमंत शंकरदेव के समय से बने सत्र — नामघर, सत्त्रिया नृत्य, भाओना और मुखौटा-कला के जीवित केंद्र।','माजुली','majuli satra',"Sattra (Ekasarana)"],
[1533,'s','संत एकनाथ','पैठण (महाराष्ट्र)','पैठण के संत एकनाथ ने भागवत पर मराठी टीका लिखी और ज्ञानेश्वरी का शुद्ध पाठ तैयार किया; भारूड से समाज को जगाया।','एकनाथ','eknath',"Eknath"],
[1535,'s','हित हरिवंश और राधावल्लभ संप्रदाय','वृंदावन','हित हरिवंश महाप्रभु ने राधा जी को केंद्र में रखकर राधावल्लभ संप्रदाय चलाया।','राधा','hit harivansh',"Hit Harivansh Mahaprabhu"],
[1540,'s','स्वामी हरिदास','वृंदावन (निधिवन)','संगीत-सम्राट तानसेन के गुरु स्वामी हरिदास ने निधिवन में बांके बिहारी जी के विग्रह को प्रकट किया।','बांके बिहारी','swami haridas',"Swami Haridas"],
[1544,'s','संत दादू दयाल','आमेर, नरैना (राजस्थान)','निर्गुण भक्ति के संत दादू दयाल ने सरल वाणी में प्रेम और सबके भीतर बसे राम की बात कही।','दादू','dadu dayal',"Dadu Dayal"],
[1565,'t','कामाख्या मंदिर का पुनर्निर्माण','नीलाचल पर्वत, गुवाहाटी','शक्तिपीठों में प्रमुख कामाख्या मंदिर को 1565 ई. में कोच राजा नरनारायण ने फिर से बनवाया।','कामाख्या','kamakhya',"Kamakhya Temple"],
[1570,'s','माधवदेव और नामघोषा','असम','श्रीमंत शंकरदेव के प्रधान शिष्य माधवदेव ने नामघोषा और बरगीत रचे, जो आज भी असम के नामघरों में गूँजते हैं।','नामघोषा','madhavdev namghosa',"Madhavdev"],
[1570,'t','बरसाना — श्री राधा रानी मंदिर','बरसाना (मथुरा)','राधा रानी के पिता वृषभानु का गाँव; भानुगढ़ पहाड़ी पर लाड़ली जी का मंदिर, और यहाँ की लट्ठमार होली विश्व-प्रसिद्ध है।','बरसाना','barsana radha rani',"Radha Rani Temple, Barsana"],
[1574,'s','तुलसीदास ने रामचरितमानस रची','अयोध्या और काशी','संवत 1631 की रामनवमी को गोस्वामी तुलसीदास ने अयोध्या में रामचरितमानस लिखना शुरू किया।','रामचरितमानस','tulsidas',"Tulsidas"],
[1580,'s','रसखान','वृंदावन, महावन','मुस्लिम परिवार में जन्मे रसखान कृष्ण-प्रेम में ऐसे डूबे कि उनके सवैये आज भी ब्रज में गाए जाते हैं।','कृष्ण','raskhan',"Raskhan"],
[1586,'t','गुरुवायूर के श्रीकृष्ण','गुरुवायूर (केरल)','केरल का सबसे प्रसिद्ध कृष्ण मंदिर। 1586 में मेलपत्तूर नारायण भट्टतिरी ने यहीं नारायणीयम् रचा।','गुरुवायूरप्पन','guruvayur',"Guruvayur Temple"],
[1590,'t','वृंदावन का गोविंद देव मंदिर','वृंदावन','आमेर के राजा मान सिंह ने लाल पत्थर का सात मंज़िला गोविंद देव मंदिर बनवाया — उत्तर भारत के सबसे भव्य मंदिरों में से एक।','गोविंद','govind dev temple',"Govind Dev Temple"],
[1596,'t','देवघर का बैद्यनाथ धाम','देवघर (झारखंड)','रावण से जुड़ी कथा वाला ज्योतिर्लिंग। सावन में सुल्तानगंज से गंगाजल लेकर कांवड़िये यहाँ आते हैं।','बाबा बैद्यनाथ','baidyanath',"Baidyanath Temple"],
[1600,'t','मदुरै का मीनाक्षी मंदिर','मदुरै (तमिलनाडु)','माँ मीनाक्षी और सुंदरेश्वर (शिव) का मंदिर। आज का विशाल रूप ज़्यादातर नायक राजाओं के समय सोलहवीं-सत्रहवीं सदी में बना।','मीनाक्षी','meenakshi',"Meenakshi Temple"],
[1600,'t','भारत के चार धाम','अखिल भारत','उत्तर में बद्रीनाथ, पश्चिम में द्वारका, पूर्व में पुरी और दक्षिण में रामेश्वरम — भारत की चारों दिशाओं के चार धाम।','चार धाम','char dham bharat',"Char Dham"],
[1600,'t','काशी का संकटमोचन हनुमान','वाराणसी (उत्तर प्रदेश)','असी नदी के किनारे वह स्थान, जहाँ परंपरा के अनुसार गोस्वामी तुलसीदास को हनुमान जी के दर्शन हुए और उन्होंने यह मंदिर स्थापित किया।','संकटमोचन','sankat mochan varanasi',"Sankat Mochan Hanuman Temple"],
[1600,'t','कुंभकोणम और महामहम','कुंभकोणम (तमिलनाडु)','प्रलय के बाद अमृत-कुंभ जहाँ टूटा, वहाँ बना महामहम कुंड; हर 12 वर्ष में यहाँ दक्षिण का कुंभ लगता है।','महामहम','kumbakonam mahamaham',"Mahamaham"],
[1608,'s','संत तुकाराम','देहू (महाराष्ट्र)','देहू के संत तुकाराम के अभंग आज भी वारकरी पंढरपुर की यात्रा में गाते हैं।','तुकाराम अभंग','tukaram',"Tukaram"],
[1608.5,'s','समर्थ रामदास','सज्जनगढ़ (महाराष्ट्र)','हनुमान भक्त समर्थ रामदास ने मनाचे श्लोक और दासबोध लिखे और जगह-जगह हनुमान मंदिर बनवाए।','समर्थ रामदास','samarth ramdas',"Samarth Ramdas"],
[1618,'t','मथुरा — श्रीकृष्ण जन्मभूमि','मथुरा (उत्तर प्रदेश)','जहाँ कंस के कारागार में श्रीकृष्ण का जन्म माना जाता है; 1618 में ओरछा के बीर सिंह बुंदेला ने यहाँ विशाल केशवदेव मंदिर बनवाया।','कृष्ण जन्मभूमि','mathura krishna janmabhoomi',"Krishna Janmasthan Temple Complex"],
[1651,'s','मोरया गोसावी — गणेश भक्त','चिंचवड (पुणे)','गाणपत्य संप्रदाय के प्रमुख संत मोरया गोसावी हर माह चिंचवड से मोरगाँव पैदल जाते थे; गणपति बाप्पा मोरया उन्हीं के नाम से जुड़ा है।','मोरया गोसावी','morya gosavi',"Morya Gosavi"],
[1671,'s','गुरु राघवेंद्र स्वामी, मंत्रालयम','मंत्रालयम (आंध्र प्रदेश)','द्वैत परंपरा के संत राघवेंद्र तीर्थ ने 1671 में तुंगभद्रा किनारे मंत्रालयम में जीवित बृंदावन प्रवेश किया।','राघवेंद्र स्वामी','raghavendra swami mantralayam',"Raghavendra Tirtha"],
[1672,'t','नाथद्वारा के श्रीनाथजी','नाथद्वारा (राजस्थान)','गोवर्धन से लाए गए श्रीनाथजी के विग्रह का रथ मेवाड़ में आकर रुक गया, और वहीं नाथद्वारा बसा।','श्रीनाथजी','nathdwara shrinathji',"Shrinathji"],
[1674,'t','भद्राचलम का राम मंदिर','भद्राचलम (तेलंगाना)','भक्त रामदास (कंचर्ला गोपन्ना) ने गोदावरी किनारे सीता-राम का मंदिर बनवाया और जेल में भी राम-भजन नहीं छोड़े।','राम','bhadrachalam',"Bhadrachalam Temple"],
[1700,'t','शनि शिंगणापुर','शिंगणापुर (अहिल्यानगर, महाराष्ट्र)','खुले आसमान के नीचे काले पत्थर के रूप में शनि देव; मान्यता है कि यहाँ के घरों में दरवाज़े और ताले नहीं लगते।','शनि शिंगणापुर','shani shingnapur',"Shani Shingnapur"],
[1720,'t','खाटू श्याम मंदिर','खाटू (सीकर, राजस्थान)','महाभारत के वीर बर्बरीक, जिन्होंने श्रीकृष्ण को शीश दान किया, खाटू में श्याम रूप में पूजे जाते हैं।','खाटू श्याम','khatu shyam',"Khatu Shyam Temple"],
[1733,'t','अनंत पद्मनाभस्वामी मंदिर','तिरुवनंतपुरम (केरल)','शेषनाग पर लेटे भगवान पद्मनाभ। राजा मार्तंड वर्मा ने 1730 के दशक में मंदिर का जीर्णोद्धार कराया और राज्य भगवान को समर्पित कर दिया।','पद्मनाभस्वामी','padmanabhaswamy',"Padmanabhaswamy Temple"],
[1734,'t','उज्जैन का महाकालेश्वर','उज्जैन (मध्य प्रदेश)','दक्षिणमुखी ज्योतिर्लिंग महाकाल। आज के मंदिर का पुनर्निर्माण अठारहवीं सदी में मराठा सरदार राणोजी शिंदे ने कराया।','महाकाल','mahakaleshwar',"Mahakaleshwar Jyotirlinga"],
[1746,'u','बिहू','असम','असम के तीन बिहू: बैसाख का रंगाली (नया साल), कार्तिक का कंगाली और माघ का भोगाली — खेती, नृत्य और ढोल-पेपा का पर्व।','बिहू','bihu assam',"Bihu"],
[1750,'s','रामप्रसाद सेन और श्यामा संगीत','हालीशहर (बंगाल)','माँ काली के भक्त कवि रामप्रसाद सेन ने बंगाल को श्यामा संगीत दिया — माँ से बच्चे की तरह बात करने वाले भजन।','काली','ramprasad sen',"Ramprasad Sen"],
[1754,'t','सालासर बालाजी','सालासर (चूरू, राजस्थान)','आसोटा गाँव में हल चलाते समय निकली हनुमान जी की मूर्ति भक्त मोहनदास जी के संकल्प से सालासर में विराजी।','सालासर बालाजी','salasar balaji',"Salasar Balaji"],
[1755,'t','त्र्यंबकेश्वर ज्योतिर्लिंग','त्र्यंबक (नासिक)','गोदावरी के उद्गम पर ब्रह्मा, विष्णु, महेश के तीन मुख वाला ज्योतिर्लिंग। आज का मंदिर पेशवा नानासाहेब ने बनवाना शुरू किया।','त्र्यंबकेश्वर','trimbakeshwar',"Trimbakeshwar Shiva Temple"],
[1767,'s','संत त्यागराज','तिरुवारूर (तमिलनाडु)','श्रीराम के भक्त त्यागराज ने हज़ारों कृतियाँ रचीं। पंचरत्न कृतियाँ कर्नाटक संगीत की धरोहर हैं।','त्यागराज','tyagaraja',"Tyagaraja"],
[1770,'t','घृष्णेश्वर ज्योतिर्लिंग','वेरुल (एलोरा के पास)','भक्त घुश्मा की कथा वाला बारहवाँ ज्योतिर्लिंग। अठारहवीं सदी में रानी अहिल्याबाई होल्कर ने इसका पुनर्निर्माण कराया।','घृष्णेश्वर','grishneshwar',"Grishneshwar Temple"],
[1770,'t','अयोध्या का हनुमानगढ़ी','अयोध्या (उत्तर प्रदेश)','मान्यता है कि हनुमान जी अयोध्या के रक्षक बनकर यहीं विराजते हैं; राम-दर्शन से पहले हनुमानगढ़ी में दर्शन की परंपरा है।','हनुमानगढ़ी','hanumangarhi ayodhya',"Hanuman Garhi"],
[1775,'s','मुथुस्वामी दीक्षितर','तिरुवारूर (तमिलनाडु)','कर्नाटक संगीत की त्रिमूर्ति में से एक दीक्षितर ने संस्कृत में देवी-देवताओं और मंदिरों पर कृतियाँ रचीं।','दीक्षितर','muthuswami dikshitar',"Muthuswami Dikshitar"],
[1776,'t','श्री गोविंदजी मंदिर, इंफाल','इंफाल (मणिपुर)','राजर्षि भाग्यचंद्र ने स्वप्न-आदेश से कैना पहाड़ी के कटहल-वृक्ष से गोविंदजी की मूर्ति बनवाई; मणिपुर के वैष्णव धर्म का हृदय।','गोविंदजी','shri govindajee imphal',"Shree Govindajee Temple"],
[1779,'u','मणिपुरी रास लीला','इंफाल (मणिपुर)','1779 में राजर्षि भाग्यचंद्र ने गोविंदजी के सामने पहली रास लीला कराई; उनकी पुत्री बिंबावती ने राधा का रूप निभाया — आज यह भारत के शास्त्रीय नृत्यों में है।','मणिपुरी रास','manipuri ras leela',"Manipuri dance"],
[1780,'t','काशी विश्वनाथ मंदिर','वाराणसी','बारह ज्योतिर्लिंगों में प्रमुख। आज का मंदिर 1780 ई. में रानी अहिल्याबाई होल्कर ने बनवाया।','काशी विश्वनाथ','kashi vishwanath',"Kashi Vishwanath Temple"],
[1781,'s','भगवान स्वामीनारायण','छपैया (अयोध्या के पास)','छपैया में जन्मे घनश्याम ने बचपन में ही गृह त्यागा और गुजरात में स्वामीनारायण संप्रदाय की नींव रखी।','स्वामीनारायण','swaminarayan',"Swaminarayan"],
[1785,'t','भीमाशंकर ज्योतिर्लिंग','सह्याद्रि (पुणे)','भीमा नदी के उद्गम पर स्थित ज्योतिर्लिंग, जहाँ शिव ने भीम असुर का वध किया। अठारहवीं सदी में नाना फडणवीस ने सभामंडप बनवाया।','भीमाशंकर','bhimashankar',"Bhimashankar Temple"],
[1787,'t','गया का विष्णुपद मंदिर','गया (बिहार)','पितरों के पिंडदान का सबसे बड़ा तीर्थ; शिला पर अंकित भगवान विष्णु के चरण पर 1787 में अहिल्याबाई होलकर ने मंदिर बनवाया।','गया पिंडदान','vishnupad gaya',"Vishnupad Mandir"],
[1801,'t','मुंबई का सिद्धिविनायक','प्रभादेवी, मुंबई','1801 में लक्ष्मण विठु और देऊबाई पाटिल ने छोटा-सा मंदिर बनवाया; आज यह देश के सबसे प्रसिद्ध गणेश मंदिरों में है।','सिद्धिविनायक','siddhivinayak',"Siddhivinayak Temple"],
[1809,'t','कोलकाता का कालीघाट','कालीघाट, कोलकाता','शक्तिपीठ परंपरा वाला माँ काली का मंदिर। आज का मंदिर 1809 ई. में बना; कोलकाता शहर का नाम इसी से जोड़ा जाता है।','कालीघाट','kalighat',"Kalighat Kali Temple"],
[1810,'t','गंगोत्री मंदिर','गंगोत्री (उत्तराखंड)','भागीरथी तट पर माँ गंगा का मंदिर, जहाँ भगीरथ शिला है। मंदिर उन्नीसवीं सदी की शुरुआत में गोरखा सेनापति अमर सिंह थापा ने बनवाया।','गंगोत्री','gangotri',"Gangotri Temple"],
[1815,'t','ज्वालामुखी शक्तिपीठ','ज्वालामुखी (कांगड़ा, हिमाचल प्रदेश)','मूर्ति नहीं, चट्टानों से निकलती नौ अखंड ज्वालाओं के रूप में देवी की पूजा; 1815 में महाराजा रणजीत सिंह ने मंदिर का गुंबद सोने से मढ़वाया।','ज्वालामुखी','jwalamukhi shaktipeeth',"Jwalamukhi Temple"],
[1818,'t','तारापीठ','तारापीठ (बीरभूम, पश्चिम बंगाल)','द्वारका नदी किनारे माँ तारा का तांत्रिक पीठ, जहाँ महाश्मशान में वशिष्ठ और बामाखेपा ने साधना की।','तारापीठ','tarapith temple',"Tarapith"],
[1827,'t','चामुंडेश्वरी, मैसूर','चामुंडी पहाड़ी (मैसूर)','महिषासुर का वध करने वाली चामुंडेश्वरी, मैसूर के वाडियार राजाओं की कुलदेवी; मैसूर (महिषूरु) का नाम महिषासुर से ही बना।','चामुंडेश्वरी','chamundeshwari mysore',"Chamundeshwari Temple"],
[1836,'s','रामकृष्ण परमहंस','दक्षिणेश्वर (कोलकाता)','माँ काली के उपासक रामकृष्ण परमहंस ने कहा — जितने मत, उतने पथ। स्वामी विवेकानंद उनके शिष्य थे।','रामकृष्ण','ramakrishna',"Ramakrishna"],
[1839,'t','यमुनोत्री धाम','यमुनोत्री (उत्तरकाशी, उत्तराखंड)','छोटे चार धाम का पहला पड़ाव — यमुना नदी का उद्गम; सूर्यकुंड के खौलते पानी में चावल-आलू पकाकर प्रसाद बनता है।','यमुनोत्री','yamunotri dham',"Yamunotri"],
[1853,'s','माँ शारदा देवी','जयरामबाटी (बंगाल)','रामकृष्ण परमहंस की पत्नी और शिष्या शारदा देवी रामकृष्ण संघ की संघ-जननी — सबकी माँ — कहलाईं।','शारदा माँ','sarada devi',"Sarada Devi"],
[1855,'t','दक्षिणेश्वर काली मंदिर','दक्षिणेश्वर (कोलकाता)','रानी रासमणि ने गंगा किनारे माँ भवतारिणी काली का मंदिर बनवाया, जहाँ रामकृष्ण परमहंस पुजारी बने।','काली','dakshineswar kali temple',"Dakshineswar Kali Temple"],
[1856,'s','अक्कलकोट के स्वामी समर्थ','अक्कलकोट (सोलापुर)','भक्तों द्वारा दत्तात्रेय का अवतार माने जाने वाले स्वामी समर्थ 1856 से 1878 तक अक्कलकोट में रहे; मंत्र — भिऊ नकोस, मी तुझ्या पाठीशी आहे।','स्वामी समर्थ','akkalkot swami samarth',"Swami Samarth"],
[1861,'s','लाहिड़ी महाशय और क्रिया योग','रानीखेत, वाराणसी','हिमालय में महावतार बाबाजी से क्रिया योग की दीक्षा लेकर लाहिड़ी महाशय ने गृहस्थ जीवन में रहते हुए उसे लोगों तक पहुँचाया।','क्रिया योग','lahiri mahasaya',"Lahiri Mahasaya"],
[1864,'t','वृंदावन का बांके बिहारी मंदिर','वृंदावन','स्वामी हरिदास को प्रकट हुए ठाकुर बांके बिहारी का आज का मंदिर 1864 ई. में बना।','बांके बिहारी','banke bihari',"Banke Bihari Temple"],
[1875,'s','स्वामी दयानंद और आर्य समाज','मुंबई','स्वामी दयानंद सरस्वती ने 1875 में मुंबई में आर्य समाज की स्थापना की और वेदों की ओर लौटो का नारा दिया।','सत्यार्थ प्रकाश','dayananda saraswati',"Dayananda Saraswati"],
[1878,'s','गजानन महाराज, शेगाँव','शेगाँव (महाराष्ट्र)','23 फ़रवरी 1878 को शेगाँव में जूठी पत्तल से अन्न खाते हुए एक अवधूत दिखे — वही गजानन महाराज कहलाए।','गजानन महाराज','gajanan maharaj',"Gajanan Maharaj"],
[1893,'s','स्वामी विवेकानंद — शिकागो','शिकागो','1893 की विश्व धर्म संसद में स्वामी विवेकानंद के "अमेरिका के बहनो और भाइयो" ने भारत का संदेश दुनिया तक पहुँचाया।','विवेकानंद','vivekananda',"Swami Vivekananda"],
[1896,'s','रमण महर्षि और अरुणाचल','तिरुवन्नामलै (तमिलनाडु)','सोलह वर्ष के वेंकटरमण को मृत्यु के अनुभव से आत्मज्ञान हुआ; 1896 में वे अरुणाचल आ गए और जीवन भर वहीं रहे।','रमण महर्षि','ramana maharshi',"Ramana Maharshi"],
[1896.5,'s','माँ आनंदमयी','खेओरा (बंगाल)','बंगाल में जन्मी माँ आनंदमयी को बचपन से ही समाधि की अवस्थाएँ होती थीं। देश भर में उनके आश्रम बने।','आनंदमयी माँ','anandamayi ma',"Anandamayi Ma"],
[1898,'t','बेलूर मठ','बेलूर (हावड़ा, बंगाल)','स्वामी विवेकानंद ने गंगा किनारे रामकृष्ण मठ और मिशन का मुख्यालय बेलूर मठ स्थापित किया।','विवेकानंद','belur math',"Belur Math"],
[1910,'s','श्री अरविंद, पुदुचेरी','पुदुचेरी','क्रांतिकारी अरविंद घोष 1910 में पुदुचेरी आए और योग-साधना में लीन होकर पूर्ण योग का मार्ग दिया।','श्री अरविंद','sri aurobindo',"Sri Aurobindo"],
[1911,'s','बामाखेपा — तारापीठ के संत','तारापीठ (बीरभूम, बंगाल)','माँ तारा के अनन्य भक्त बामाखेपा ने तारापीठ के श्मशान में साधना की; लोग उन्हें माँ का पागल बेटा कहते थे।','बामाखेपा','bamakhepa tarapith',"Bamakhepa"],
[1912,'t','क्षीर भवानी, तुलमुल','तुलमुल (गांदरबल, कश्मीर)','झरने के बीच बसी देवी राग्न्या, जिनके कुंड का पानी रंग बदलता है; कश्मीरी पंडितों का सबसे बड़ा तीर्थ।','क्षीर भवानी','kheer bhawani tulmul',"Kheer Bhawani"],
[1918,'t','शिरडी के साईं बाबा','शिरडी (महाराष्ट्र)','शिरडी के साईं बाबा ने श्रद्धा और सबुरी का संदेश दिया। 1918 में विजयादशमी पर उन्होंने समाधि ली।','साईं बाबा','shirdi sai',"Shirdi Sai Baba"],
[1920,'s','परमहंस योगानंद','अमेरिका','1920 में योगानंद अमेरिका गए और क्रिया योग पश्चिम तक पहुँचाया। उनकी योगी कथामृत दुनिया भर में पढ़ी जाती है।','योगी कथामृत','paramahansa yogananda',"Paramahansa Yogananda"],

function AC(){if(!SND.c){try{SND.c=new(window.AudioContext||window.webkitAudioContext)();SND.m=SND.c.createGain();SND.m.gain.value=.9;
 const comp=SND.c.createDynamicsCompressor();SND.m.connect(comp).connect(SND.c.destination);
 // simple reverb
 const len=SND.c.sampleRate*2.6,b=SND.c.createBuffer(2,len,SND.c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4)}
 SND.rv=SND.c.createConvolver();SND.rv.buffer=b;SND.rg=SND.c.createGain();SND.rg.gain.value=.35;SND.rv.connect(SND.rg).connect(SND.m)}catch(_){return null}}
 if(SND.c.state==='suspended')SND.c.resume();return SND.c}

 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);out(g,.6);
 [[1,1],[2.0,.55],[2.74,.35],[4.07,.2],[5.43,.12],[.5,.25]].forEach(([r,a],j)=>{const o=c.createOscillator(),h=c.createGain();o.type='sine';o.frequency.value=f*r*(1+(j%2?.0025:-.0015));
  h.gain.setValueAtTime(a,t);h.gain.exponentialRampToValueAtTime(.0001,t+d/(1+j*.7));o.connect(h).connect(g);o.start(t);o.stop(t+d+.1)})}
function tick(){if(!SND.on||!SND.c)return;const n=performance.now();if(n-SND.lt<55)return;SND.lt=n;const c=SND.c,t=c.currentTime;

 const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=950+Math.random()*180;f.Q.value=4;const g=c.createGain();g.gain.value=.38;s.connect(f).connect(g);out(g,.1);s.start(t);

 const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=5.2;lg.gain.value=2.2;lfo.connect(lg);lfo.start(t);lfo.stop(t+3.3);
