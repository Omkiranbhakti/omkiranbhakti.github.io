#pic .yb{position:absolute;left:10px;top:10px;z-index:2;font-size:.72rem;font-weight:700;color:#1a0f05;background:var(--yc);padding:2px 9px;border-radius:10px}
.cb{padding:0 16px 14px;margin-top:-34px;position:relative;z-index:2}
#ttl{margin:0;font-size:1.45rem;line-height:1.3;text-shadow:0 2px 10px #000}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.74rem;color:var(--mut);margin-top:4px}
.dt{padding:1px 8px;border-radius:10px;font-weight:600}
.t-p{background:#f0c25e26;color:#f5cf7a}.t-u{background:#3fbf8f26;color:#78e6b8}.t-n{background:#ff4d6d26;color:#ff98aa}.t-b{background:#b06cff26;color:#d3abff}
#ds{margin:7px 0 10px;font-size:.9rem;color:#e4d4bb;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.55}
.crow{display:flex;gap:8px}
.crow button,.crow a{flex:1;text-align:center;border-radius:12px;padding:8px 6px;font-size:.86rem;text-decoration:none;color:var(--txt);border:1px solid var(--line);background:#ffffff0c}
.crow .pri{background:linear-gradient(135deg,#f3c25d,#d9831f);color:#2a1606;font-weight:700;border:0}
#card.sw{animation:sw .45s}

#yn{position:fixed;left:0;right:0;z-index:3;text-align:center;pointer-events:none;font-size:1.25rem;color:var(--yc);text-shadow:0 0 18px var(--yc);transition:color 1s}
#hintd{position:fixed;left:0;right:0;z-index:3;text-align:center;font-size:.75rem;color:#ffffff88;pointer-events:none;transition:opacity 1s}

#ov{position:fixed;inset:0;background:#000b;z-index:20;opacity:0;pointer-events:none;transition:.3s}
#ov.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:640px;margin:0 auto;background:linear-gradient(#2a1b0d,#140c06);border-radius:22px 22px 0 0;border-top:2px solid var(--gold);padding:10px 18px 24px;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);max-height:90vh;overflow-y:auto}
#sh.on{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:#6a5338;margin:0 auto 12px}
#sh h2{margin:0 0 4px;font-size:1.6rem;color:var(--gold);line-height:1.3}
#sh .full{font-size:1.02rem;line-height:1.75;color:#efe2cc}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0 4px}

.acts a.wa{grid-column:1/-1;background:#1f8f4e;border-color:#1f8f4e;font-weight:700}
.shimg{width:100%;max-height:240px;object-fit:cover;border-radius:14px;margin:6px 0 10px;display:block}
/* list */
#lv{position:fixed;inset:0;z-index:30;background:#0d0805f5;transform:translateX(100%);transition:transform .35s;display:flex;flex-direction:column}
#lv.on{transform:none}
#lv .lh{display:flex;gap:8px;align-items:center;padding:12px}
#lv input{flex:1;padding:10px 14px;border-radius:12px;border:1px solid var(--gold);background:#1c130b;color:var(--txt);font:inherit;outline:0}
#ll{overflow-y:auto;padding:0 12px 40px;flex:1}
#ll h3{font-family:"Tiro Devanagari Hindi",serif;font-weight:400;margin:18px 0 6px;font-size:1.2rem}
#ll button{display:flex;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:10px;border-bottom:1px solid #ffffff10}

#ll .li{font-size:1.2rem}
#ll small{display:block;color:var(--mut);font-size:.72rem}
/* intro */
#intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 45%,#2c1a0acc,#070403 75%);transition:opacity 1.2s}

#intro .om{font-size:4.2rem;color:var(--gold);text-shadow:0 0 30px #f0c25e,0 0 60px #d9831f;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{text-shadow:0 0 14px #f0c25e,0 0 30px #d9831f;transform:scale(.96)}}

#intro p{color:var(--mut);margin:0 0 6px;max-width:360px;line-height:1.6}
#intro .go{margin-top:18px;background:linear-gradient(135deg,#f3c25d,#d9831f);color:#2a1606;border-radius:40px;padding:14px 34px;font-weight:700;font-size:1.1rem;box-shadow:0 6px 28px #e8b04a66}
#intro small{display:block;margin-top:14px;color:#8d7858;font-size:.78rem}
#err{display:none;position:fixed;inset:auto 12px 12px;z-index:50;background:#400;padding:10px;border-radius:10px;font-size:.8rem}
/* desktop */
@media (min-aspect-ratio:11/10){
 #card{left:28px;right:auto;width:min(420px,38vw);top:50%!important;transform:translateY(-50%)}
 #card.sw{animation:none}
 #pic{height:240px;max-height:none}
 #ds{-webkit-line-clamp:4}
}
</style>

 if(rg.e-rg.s>=2){const am=(ang(rg.s)+ang(rg.e))/2,s=new THREE.Sprite(new THREE.SpriteMaterial({map:textTex(y[1],64,y[2]),transparent:true,depthWrite:false}));s.scale.set(5.2,1.3,1);s.position.set(Math.cos(am)*R*1.2,Math.sin(am)*R*1.2,.3);spin.add(s)}});
// event dots
const dots=[],hits=[];const hitMat=new THREE.MeshBasicMaterial({visible:false});
E.forEach((e,i)=>{const a=ang(i),x=Math.cos(a)*R*.9,y=Math.sin(a)*R*.9,col=new THREE.Color(C[e.c][2]);
 const s=new THREE.Mesh(new THREE.SphereGeometry(.2,12,10),new THREE.MeshBasicMaterial({color:col}));s.position.set(x,y,.3);spin.add(s);
 const g=new THREE.Sprite(new THREE.SpriteMaterial({map:GT,color:col,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.75}));g.scale.set(1.3,1.3,1);g.position.set(x,y,.35);spin.add(g);
 const h=new THREE.Mesh(new THREE.SphereGeometry(.65,8,6),hitMat);h.position.set(x,y,.3);h.userData.i=i;spin.add(h);hits.push(h);dots.push({s,g})});
// pointer diya at top (does not rotate)
const ptr=new THREE.Group();root.add(ptr);ptr.position.set(0,R*1.13,.4);

const bowl=new THREE.Mesh(new THREE.SphereGeometry(.55,16,10,0,Math.PI*2,Math.PI/2,Math.PI/2),gold2);bowl.position.y=.75;bowl.rotation.x=Math.PI;ptr.add(bowl);
const flame=new THREE.Sprite(new THREE.SpriteMaterial({map:GT,color:0xffa030,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));flame.position.y=1.35;flame.scale.set(1.1,1.8,1);ptr.add(flame);
const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:GT,color:0xff9030,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.5}));halo.position.y=1.2;halo.scale.set(4,4,1);ptr.add(halo);
// sparks
const SPN=260,sg=new THREE.BufferGeometry(),sp=new Float32Array(SPN*3),sv=new Float32Array(SPN);
for(let i=0;i<SPN;i++){sp[i*3]=(Math.random()-.5)*R*3.2;sp[i*3+1]=(Math.random()-.5)*R*3.2;sp[i*3+2]=Math.random()*8-2;sv[i]=.01+Math.random()*.03}
sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
const smat=new THREE.PointsMaterial({map:GT,size:.38,color:0xffc060,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,opacity:.8});

// ---------- layout ----------
let wide=false,W=1,H=1;
function layout(){W=innerWidth;H=innerHeight;renderer.setSize(W,H,false);cam.aspect=W/H;wide=W/H>1.1;
 const t=Math.tan(cam.fov*Math.PI/360);
 if(wide){cam.position.set(0,0,R*2.9/ t/2.2);const hh=t*cam.position.z,hw=hh*cam.aspect;root.position.set(hw*.33,-hh*.08,0);root.rotation.x=-.5;
  $('#card').style.top='50%';}
 else{const z=(R*1.16)/(t*cam.aspect);cam.position.set(0,0,z);const hh=t*z;root.position.set(0,-hh*.5,0);root.rotation.x=-.78;}
 cam.lookAt(0,0,0);cam.updateProjectionMatrix();sparks.position.copy(root.position);
 pl.position.set(root.position.x,root.position.y+R*1.2,6);
 // place DOM around the wheel
 const p=v=>{const q=v.clone().project(cam);return{x:(q.x+1)/2*W,y:(1-q.y)/2*H}};
 root.updateMatrixWorld(true);
 const top=p(new THREE.Vector3(0,R*1.13,.4).applyMatrix4(root.matrixWorld)),ctr=p(new THREE.Vector3(0,0,0).applyMatrix4(root.matrixWorld)),bot=p(new THREE.Vector3(0,-R,0).applyMatrix4(root.matrixWorld)),lft=p(new THREE.Vector3(-R,0,0).applyMatrix4(root.matrixWorld)),rgt=p(new THREE.Vector3(R,0,0).applyMatrix4(root.matrixWorld));
 if(!wide){$('#card').style.top='58px';$('#yc').style.top=(top.y-58)+'px';}else{$('#yc').style.top='60px';$('#yc').style.left=(W*.45)+'px'}
 $('#yn').style.top=(ctr.y+(bot.y-ctr.y)*.18+18)+'px';$('#kc').style.top=Math.min(H-26,bot.y+10)+'px';$('#hintd').style.top=Math.min(H-46,bot.y-12)+'px';
 if(wide){$('#yn').style.left=$('#kc').style.left=$('#hintd').style.left=(ctr.x-W/2)*2+'px'}else{$('#yn').style.left=$('#kc').style.left=$('#hintd').style.left='0px'}
 $('#bPrev').style.left=Math.max(6,lft.x-6)+'px';$('#bPrev').style.top=(ctr.y-23)+'px';$('#bNext').style.left=Math.min(W-52,rgt.x-40)+'px';$('#bNext').style.top=(ctr.y-23)+'px';
 if(!wide){const ch=$('#card').offsetHeight,lim=top.y-64;if(58+ch>lim){$('#pic').style.height=Math.max(110,$('#pic').offsetHeight-(58+ch-lim))+'px'}}
}
addEventListener('resize',()=>{$('#pic').style.height='';layout()});

// ---------- rotation state ----------
let th=0,vel=0,target=null,ease=.14,drag=false,lastCi=null,settled=-1,curY=null;
const idx=t=>((Math.round(t/STEP)%N)+N)%N;
function go(i,e2){const cur=th/STEP;let d=((i-cur)%N+N)%N;if(d>N/2)d-=N;target=(cur+d)*STEP;ease=e2||.12;vel=0}
function step(d){go(idx(th)+d)}
// pointer input
let px=0,py=0,pt=0,moved=0,lastX=0,lastT=0;
cv.addEventListener('pointerdown',e=>{drag=true;target=null;px=lastX=e.clientX;py=e.clientY;pt=lastT=performance.now();moved=0;vel=0;cv.setPointerCapture(e.pointerId);AC()});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lastX,now=performance.now();moved+=Math.abs(dx)+Math.abs(e.clientY-py)*0;
 const k=(wide?1:1.5)*Math.PI/W;th+=-dx*k;vel=-dx*k/Math.max(1,(now-lastT))*16;lastX=e.clientX;lastT=now;hideHint()});
cv.addEventListener('pointerup',e=>{drag=false;if(performance.now()-lastT>90)vel=0;if(moved<6&&performance.now()-pt<400)tap(e)});
cv.addEventListener('pointercancel',()=>{drag=false});
cv.addEventListener('wheel',e=>{e.preventDefault();target=null;vel+=(e.deltaY+e.deltaX)*.00035;hideHint()},{passive:false});
addEventListener('keydown',e=>{if($('#sh').classList.contains('on')||$('#lv').classList.contains('on')){if(e.key==='Escape'){closeSheet();$('#lv').classList.remove('on')}return}if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function tap(e){mv.set(e.clientX/W*2-1,-(e.clientY/H)*2+1);ray.setFromCamera(mv,cam);const h=ray.intersectObjects(hits)[0];if(h)go(h.object.userData.i)}
$('#bPrev').onclick=()=>{AC();step(-1)};$('#bNext').onclick=()=>{AC();step(1)};
let hinted=false;function hideHint(){if(!hinted){hinted=true;$('#hintd').style.opacity=0}}

// ---------- card ----------
function setYuga(k){if(curY===k)return;const first=curY===null;curY=k;const y=YG(k);
 document.documentElement.style.setProperty('--yc',y[2]);document.documentElement.style.setProperty('--s1',y[3]);
 smat.color.set(y[2]);pl.color.set(y[2]);$('#yn').textContent=y[1];
 document.querySelectorAll('#yc button').forEach(b=>{const on=b.dataset.y===k;b.classList.toggle('on',on);if(on)b.scrollIntoView({inline:'center',block:'nearest'})});
 if(!first&&started){shankh(.05)}}
function quick(i){const e=E[i],tc=tclass(e);$('#ttl').textContent=e.t;$('#ds').textContent=e.d;$('#meta').innerHTML=`<span class="dt t-${tc[0]}">${tc[1]} • ${dlabel(e.y)}</span><span>📍 ${e.p}</span>`;$('#fb').textContent=C[e.c][1];$('#yb').textContent=YG(e.yk)[1];setYuga(e.yk)}
let imgTok=0;
function card(i){const e=E[i],tc=tclass(e),y=YG(e.yk);
 $('#ttl').textContent=e.t;$('#meta').innerHTML=`<span class="dt t-${tc[0]}">${tc[1]} • ${dlabel(e.y)}</span><span>📍 ${e.p}</span><span>${C[e.c][1]} ${C[e.c][0]}</span>`;
 $('#ds').textContent=e.d;$('#yb').textContent=y[1];$('#card').style.setProperty('--cc',C[e.c][2]);
 const fb=$('#fb');fb.textContent=C[e.c][1];fb.style.opacity=1;$('#pic').style.backgroundImage='none';$('#cr').textContent='';
 $('#bWa').href=waLink(e);
 const c=$('#card');c.classList.remove('sw');void c.offsetWidth;c.classList.add('sw');
 const tok=++imgTok;img(e).then(v=>{if(tok!==imgTok||!v)return;const im=new Image();im.onload=()=>{if(tok!==imgTok)return;$('#pic').style.backgroundImage=`url("${v.s}")`;fb.style.opacity=0;$('#cr').textContent='चित्र: Wikimedia Commons';$('#cr').href=v.u};im.onerror=()=>{if(v.t&&im.src!==v.t){v.s=v.t;im.src=v.t}};im.src=v.s});
 [1,-1,2].forEach(d=>img(E[(i+d+N)%N]));
 if(started)bell(e.c==='n'?440:e.c==='b'?392:528,.09,3)}
function waLink(e){return'https://wa.me/?text='+encodeURIComponent(`🕉️ *${e.t}*\n${dlabel(e.y)} • ${e.p}\n\n${e.d}\n\nकाल-चक्र घुमाइए, सृष्टि से कल्कि तक की हर कथा 👇\nhttps://omkiranbhakti.com/kaal-chakra/`)}
function openSheet(i){const e=E[i],tc=tclass(e),kw=e.k||'भजन',y=YG(e.yk);
 $('#sh').innerHTML=`<div class="grab"></div><img class="shimg" id="shi" alt="" hidden><h2 class="serif">${e.t}</h2><div class="meta" style="margin-bottom:10px"><span class="dt t-${tc[0]}">${tc[1]} • ${dlabel(e.y)}</span><span>📍 ${e.p}</span><span style="color:${y[2]}">● ${y[1]}</span></div>
 <div id="kt"><p class="full">${e.d}</p></div>
 <div class="acts"><a href="https://www.youtube.com/@OmKiranBhakti/search?query=${encodeURIComponent(kw)}" target="_blank" rel="noopener">▶️ ${kw} भजन</a>
 <a href="https://www.amazon.in/s?k=${encodeURIComponent(kw+' पूजा सामग्री')}&tag=omkiranbhakti-21" target="_blank" rel="noopener sponsored">🪔 पूजा सामग्री</a>
 <a class="wa" href="${waLink(e)}" target="_blank" rel="noopener">📲 WhatsApp पर भेजें</a></div>`;
 img(e).then(v=>{if(v){const im=$('#shi');if(im){im.onerror=()=>{if(v.t&&im.src!==v.t)im.src=v.t};im.src=v.s;im.hidden=false}}});
 loadKatha().then(K=>{const k=K&&K[e.t],el=$('#kt');if(!k||!el||$('#sh').dataset.i!=i)return;const p=s=>s.split('\n\n').map(x=>`<p class="full">${x}</p>`).join('');
  el.innerHTML=p(k[0])+`<h3 class="ks">🙏 महत्व / संदेश</h3><p class="full">${k[1]}</p>`+(k[2]&&k[2]!=='—'?`<h3 class="ks">📍 तीर्थ / कहाँ मनाया जाता है</h3><p class="full">${k[2]}</p>`:'')+`<h3 class="ks">📜 स्रोत</h3><p class="full src">${k[3]}</p>`});
 $('#sh').dataset.i=i;$('#sh').classList.add('on');$('#ov').classList.add('on');$('#sh').scrollTop=0}
let kP=null;function loadKatha(){return kP||(kP=new Promise(r=>{if(window.KATHA)return r(window.KATHA);const s=document.createElement('script');s.src='katha.js?v=1';s.onload=()=>r(window.KATHA);s.onerror=()=>{kP=null;r(null)};document.head.appendChild(s)}))}
function closeSheet(){$('#sh').classList.remove('on');$('#ov').classList.remove('on')}
$('#bRead').onclick=()=>openSheet(idx(th));$('#ov').onclick=closeSheet;
let sy=0;$('#sh').addEventListener('touchstart',e=>{sy=e.touches[0].clientY},{passive:true});$('#sh').addEventListener('touchend',e=>{if(e.changedTouches[0].clientY-sy>90&&$('#sh').scrollTop<=0)closeSheet()});

const firstOf=k=>E.findIndex(e=>e.yk===k);
$('#yc').innerHTML=Y.map(y=>`<button data-y="${y[0]}">${y[1]}</button>`).join('');
$('#yc').onclick=e=>{const b=e.target.closest('button');if(b){AC();go(b.dataset.y==='aaj'?NOWI:firstOf(b.dataset.y),.08)}};
function renderList(q){q=(q||'').trim().toLowerCase();let h='';Y.forEach(y=>{const ev=E.filter(e=>e.yk===y[0]&&(!q||(e.t+e.p+e.d+e.k+e.r).toLowerCase().includes(q)));if(!ev.length)return;
 h+=`<h3 style="color:${y[2]}">${y[1]}</h3>`+ev.map(e=>`<button data-i="${e.i}"><span class="li">${C[e.c][1]}</span><span>${e.t}<small>${dlabel(e.y)} • ${e.p}</small></span></button>`).join('')});
 $('#ll').innerHTML=h||'<p style="text-align:center;color:#c4ae8e;padding:30px">कुछ नहीं मिला 🙏</p>'}

$('#q').oninput=e=>renderList(e.target.value);
$('#ll').onclick=e=>{const b=e.target.closest('button');if(b){$('#lv').classList.remove('on');AC();go(+b.dataset.i,.09)}};
const KS=-3102,KL=432000;function kclock(){const el=NOW-KS;$('#kc').innerHTML=`कलियुग: <b>${fmt(el)}</b> वर्ष बीते • <b>${fmt(KL-el)}</b> वर्ष शेष`}
kclock();

// ---------- animate ----------
let started=false,clk=new THREE.Clock();
function frame(){requestAnimationFrame(frame);const dt=Math.min(clk.getDelta(),.05),T=clk.elapsedTime;
 if(!drag){const f=dt*60;if(target!==null){th+=(target-th)*(1-Math.pow(1-ease,f));if(Math.abs(target-th)<.0004){th=target;target=null;vel=0}}
  else if(Math.abs(vel)>.0006){th+=vel*f;vel*=Math.pow(.945,f)}else{vel=0;const s=Math.round(th/STEP)*STEP;if(Math.abs(s-th)>.0004){target=s;ease=.16}}}
 const ci=Math.round(th/STEP);if(ci!==lastCi){if(lastCi!==null)tick();lastCi=ci;quick(idx(th))}
 const still=!drag&&target===null&&vel===0,cur=idx(th);if(still&&settled!==cur){settled=cur;card(cur)}
 spin.rotation.z=th;lotus.rotation.z=-th*.35+T*.05;
 dots.forEach((d,i)=>{const on=i===cur;const sc=on?1.9+Math.sin(T*4)*.15:1;d.s.scale.setScalar(sc);d.g.scale.setScalar(on?3.2:1.3)});
 flame.scale.set(1+Math.sin(T*13)*.08,1.8+Math.sin(T*9)*.18,1);halo.material.opacity=.45+Math.sin(T*7)*.08;hubGlow.material.opacity=.45+Math.sin(T*1.4)*.12;
 const a=sg.attributes.position.array;for(let i=0;i<SPN;i++){a[i*3+1]+=sv[i];a[i*3]+=Math.sin(T+i)*.004;if(a[i*3+1]>R*1.8)a[i*3+1]=-R*1.6}sg.attributes.position.needsUpdate=true;
 root.rotation.y=Math.sin(T*.25)*.05;
 renderer.render(scene,cam)}
// start position: a little before "आज", then land on it in the intro
th=(NOWI-6)*STEP;lastCi=Math.round(th/STEP);
layout();frame();quick(idx(th));card(idx(th));
document.fonts&&document.fonts.ready.then(()=>{layout()});
$('#go').onclick=()=>{started=true;AC();om();const lr=loadReal(),t0=Date.now();lr.then(()=>setTimeout(()=>shankh(.06),Math.max(0,500-(Date.now()-t0))));if(SND.tan)setTimeout(tanStart,1800);
 $('#intro').classList.add('hide');th=(NOWI-N-6)*STEP;lastCi=Math.round(th/STEP);settled=-1;target=null;vel=0;setTimeout(()=>{target=NOWI*STEP;ease=.04},350)};
