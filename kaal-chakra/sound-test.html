<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>आवाज़ चुनें — काल-चक्र</title>
<style>body{margin:0;background:#120b06;color:#efe2cc;font:17px/1.6 "Noto Sans Devanagari",system-ui,sans-serif}main{max-width:560px;margin:auto;padding:16px}
h1{color:#f5c66b;font-size:1.35rem;margin:.3em 0}h2{color:#f5c66b;font-size:1.1rem;margin:22px 0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap}button{font:600 1.05rem inherit;font-family:inherit;border:1px solid #f5c66b;background:#2a1c10;color:#fbe7c0;border-radius:14px;padding:12px 18px;min-width:96px;cursor:pointer}
button.on{background:#f5c66b;color:#120b06}.stop{border-color:#a55;color:#f99}p.s{opacity:.8;font-size:.9rem}</style></head>
<body><main><h1>🎧 काल-चक्र की आवाज़ चुनें</h1>
<p>फ़ोन पर हेडफ़ोन लगाकर हर विकल्प सुनें। जो सबसे अच्छा लगे, उसका कोड (जैसे <b>T2, B1, S1</b>) Claude को लिख दें।</p>
<h2>🪕 तानपुरा (लगातार बजेगा — लूप भी जाँचें, कहीं झटका तो नहीं)</h2><div class="row" id="T"></div>
<h2>🔔 घंटी</h2><div class="row" id="B"></div>
<h2>🐚 शंख</h2><div class="row" id="S"></div>
<p><button class="stop" id="stop">⏹ सब रोकें</button></p>
<p class="s">सभी रिकॉर्डिंग Freesound / Wikimedia Commons से (CC0 या CC BY), श्रेय <a style="color:#f5c66b" href="credits.html#audio">चित्र-श्रेय</a> पेज पर।</p></main>
<script>
let ac,cur=null;const bufs={};
function A(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=='running')ac.resume();return ac}
async function get(k){if(bufs[k])return bufs[k];const a=await fetch('snd/test/'+k+'.mp3').then(r=>r.arrayBuffer());return bufs[k]=await new Promise((ok,no)=>A().decodeAudioData(a,ok,no))}
function stop(){if(cur){try{cur.s.stop()}catch(e){}cur.b.classList.remove('on');cur=null}}
async function play(k,b){const c=A();stop();const buf=await get(k);const s=c.createBufferSource();s.buffer=buf;s.loop=k[0]==='t';const g=c.createGain();g.gain.value=k[0]==='t'?.8:1;s.connect(g).connect(c.destination);s.start();b.classList.add('on');cur={s,b};s.onended=()=>{if(cur&&cur.s===s)stop()}}
[['T',['t1','t2','t3']],['B',['b1','b2','b3']],['S',['s1','s2']]].forEach(([id,ks])=>ks.forEach(k=>{const b=document.createElement('button');b.textContent='▶ '+k.toUpperCase();b.onclick=()=>cur&&cur.b===b?stop():play(k,b);document.getElementById(id).appendChild(b)}));
document.getElementById('stop').onclick=stop;
</script></body></html>
