name: shot
on: workflow_dispatch
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir o && cd o && npm i -s playwright@1.47.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > s.js <<'J'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch();
          for(const [n,w,h,m] of [['d',1366,2600,false],['m',390,2400,true]]){const p=await b.newPage({viewport:{width:w,height:h},isMobile:m});
          await p.goto('https://www.bhaktibharat.com/',{waitUntil:'networkidle',timeout:60000}).catch(()=>{});await p.waitForTimeout(3000);await p.screenshot({path:'bb_'+n+'.png'});}
          await b.close();})();
          J
          node s.js; ls -la
          git init -q && git checkout -q -b shot && git add *.png && git -c user.name=b -c user.email=b@x commit -qm s && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" shot
