name: kaal-chakra-assets
on:
  push:
    branches: [main]
    paths: ['tools/kc_run.txt']
  workflow_dispatch:
    inputs:
      mode: {description: "cand | sound | fsids | build", required: true, default: cand}
      ids: {description: "fsids: key:id ...", required: false, default: ""}
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env: {MODE: "${{ github.event.inputs.mode }}"}
    steps:
      - uses: actions/checkout@v4
      - run: '[ -n "$MODE" ] || echo "MODE=$(head -1 tools/kc_run.txt | tr -d "[:space:]")" >> $GITHUB_ENV'
      - name: tools
        timeout-minutes: 10
        run: |
          which montage convert || sudo apt-get install -y -qq --no-install-recommends imagemagick
          case "$MODE" in sound|fsids|fsapi) which ffmpeg || sudo apt-get install -y -qq --no-install-recommends ffmpeg;; esac
          which montage convert
      - name: cand/sound -> branch kc-assets
        if: env.MODE != 'build'
        env: {IDS: "${{ github.event.inputs.ids }}", FSKEY: "${{ secrets.FREESOUND_KEY }}"}
        run: |
          python3 tools/kc_assets.py $MODE
          git fetch -q origin kc-assets && git worktree add -q w origin/kc-assets 2>/dev/null || { mkdir w && cd w && git init -q && git checkout -q -b kc-assets && cd ..; }
          rm -rf w/$MODE && mkdir -p w/$MODE && cp -r out/* w/$MODE/
          cd w && git checkout -q -B kc-assets && git add -A && git -c user.name=bot -c user.email=bot@x commit -qm "$MODE $(date -u +%F)" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" kc-assets
      - name: build -> main
        if: env.MODE == 'build'
        run: |
          git config user.name bot && git config user.email bot@x
          python3 tools/kc_assets.py build
          git add kaal-chakra/img && git -c user.name=bot -c user.email=bot@x commit -qm "Kaal-Chakra: images (WebP) + credits" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
