name: Build and deploy OmKiran Bhakti

on:
  push:
    branches: ["main"]
  schedule:
    # 00:05 IST every day (18:35 UTC) — refreshes "आज का पंचांग", upcoming festivals and sitemap dates
    - cron: "35 18 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install panchang library
        run: pip install ephem==4.2.1
      - name: Build site (today's panchang)
        run: python src/build.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
