name: Live now (which temples are streaming)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      args:
        description: extra args (e.g. --debug)
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: "live-now"
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            src/live_section.py
            tools/live_now.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check temple channels
        run: python tools/live_now.py ${{ github.event.inputs.args }}
      - name: Publish to branch live-status
        env:
          TOKEN: ${{ github.token }}
        run: |
          mkdir /tmp/pub && cp live-now.json /tmp/pub/ && cd /tmp/pub
          git init -q -b live-status
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add live-now.json && git commit -qm "live now"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" live-status
