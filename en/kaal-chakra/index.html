[-1700000000,'v','King Prithu Milks the Earth','Brahmavarta','When the Earth hid her grain, King Prithu milked her in the form of a cow to bring back food and herbs. The Earth is called "Prithvi" after him.','विष्णु','prithu',"Prithu"],
[-1700000000,'sh','Shiva Destroys the Three Cities','All of India','With a single arrow Mahadev burned the three flying cities of Tarakasura\'s sons and became Tripurari.','त्रिपुरारी','tripurasur vadh',"Tripurantaka"],
[-1600000000,'sh','Durga Slays Mahishasura','Vindhyachal / all of India','Born from the combined radiance of the gods, Mother Durga fought for nine days and slew Mahishasura.','दुर्गा','durga mahishasura mardini',"Mahishasura Mardini"],
[-1000000000,'sh','Markandeya and the Mahamrityunjaya','All of India','Destined to die at sixteen, Markandeya embraced the Shiva-linga; Mahadev stopped Yama and made him immortal.','महामृत्युंजय','markandeya mahamrityunjay',"Markandeya"],
[-700000000,'sh','Lingodbhava, the Endless Pillar of Light','Arunachala','Between Brahma and Vishnu appeared an endless pillar of fire whose ends neither could find: the origin of the Shiva-linga.','लिंगोद्भव','lingodbhava',"Lingodbhava"],
[-400000000,'a','Gajendra Moksha','Trikuta mountain','Caught by a crocodile, the elephant king called on the Lord; Shri Hari rushed on Garuda and freed him with the chakra.','गजेंद्र मोक्ष','gajendra moksha',"Gajendra Moksha"],
[-300000000,'a','Samudra Manthan and the Kurma Avatar','Kshira Sagar (Ocean of Milk)','Devas and asuras churned the Ocean of Milk with Mount Mandara as the rod and Vasuki as the rope. Lord Kurma held the mountain on his back, and fourteen treasures came out.','विष्णु','samudra manthan kurma',"Samudra manthan"],
[-299999000,'sh','Mahadev Becomes Neelkanth','Kshira Sagar (Ocean of Milk)','The Halahala poison from the churning began to burn all creation. Mahadev drank it and held it in his throat, and was called Neelkanth, the blue-throated one.','शिव','neelkanth shiv',"Halahala"],
[-299998000,'a','Mohini Avatar and the Story of Kumbh','Prayag, Haridwar, Ujjain, Nashik','As Mohini, Vishnu served the amrit to the devas. The four places where drops from the amrit pot fell are where the Kumbh Mela is held today.','कुंभ','mohini kumbh',"Mohini"],
[-120533200,'a','Matsya Avatar and the Great Flood','Himalaya','In the waters of the pralaya, Lord Matsya tied Manu\'s boat to his horn and saved it, protecting the Vedas and the Saptarishis.','विष्णु','matsya avatar',"Matsya"],
[-120533102,'c','Beginning of the Vaivasvata Manvantara','The cosmos','The age of the seventh Manu, Vaivasvata Manu, began. This is the present manvantara.','विष्णु','manvantar',"Vaivasvata Manu"],
[-120000000,'v','Ikshvaku and the Solar Dynasty','Ayodhya','Vaivasvata Manu founded Ayodhya, and the Suryavansh (Solar Dynasty) began with his son Ikshvaku. Harishchandra, Bhagiratha and Shri Ram were later born in this line.','राम','ikshvaku suryavansh',"Ikshvaku"],
[-119990000,'v','Pururava and the Lunar Dynasty','Pratishthana (Prayag)','The Chandravansh began with Pururava, son of Budha and Ila. Yadu, Kuru, the Pandavas and Shri Krishna were born in this line.','कृष्ण','pururava chandravansh',"Pururavas"],
[-3891102,'c','Beginning of Satya Yuga','Bharatvarsha','The first yuga of the present, 28th mahayuga. Dharma stood on all four legs — truth, austerity, compassion and charity.','विष्णु','satyug',"Satya Yuga"],
[-3700000,'s','Narada, the Divine Sage','The three worlds','With his vina and the name of Narayana, Devarshi Narada roamed the three worlds and set Dhruva, Prahlada and Valmiki on the path of devotion.','नारद','narad muni devarshi',"Narada"],
[-3500000,'a','Narasimha Avatar — Prahlada Saved','Ahobilam (tradition)','Hiranyakashipu tried to kill his devotee son Prahlada. The Lord burst out of a pillar as Narasimha and slew him on the threshold at dusk.','नृसिंह','narsingh prahlad holi',"Narasimha"],
[-3000000,'v','King Harishchandra\'s Test of Truth','Ayodhya, Kashi','To keep his word, Harishchandra gave up his kingdom, wife and son and became a servant at the cremation ground. Unshaken in truth, he became immortal.','सत्यनारायण','harishchandra',"Harishchandra"],
[-3000000,'s','Savitri and Satyavan','Madra','Following Yama who had taken her husband\'s life, Savitri won Satyavan back through wisdom and devotion.','सावित्री','savitri satyavan',"Savitri and Satyavan"],
[-2900000,'s','Nachiketa and Yama','All of India','Young Nachiketa refused wealth and kingdoms and asked Yama the truth beyond death; this is the Katha Upanishad.','नचिकेता','nachiketa yama',"Nachiketa"],
[-2200000,'s','Atri, Anasuya and the Birth of Dattatreya','Chitrakoot','The Trimurti, come to test Anasuya, became her sons; Dattatreya, born of Vishnu, is worshipped in three-faced form.','दत्तात्रेय','atri anasuya dattatreya',"Dattatreya"],
[-2163102,'c','Beginning of Treta Yuga','Bharatvarsha','Dharma now stood on three legs. This is the age of the Vamana, Parashurama and Shri Ram avatars.','विष्णु','treta yug',"Treta Yuga"],
[-2100000,'a','Vamana Avatar and King Bali','Bhrigukachchha (tradition)','Vamana asked the generous King Bali for three steps of land and measured all the worlds in two. Bali offered his head for the third step and became king of Patala.','विष्णु','vaman bali onam',"Vamana"],
[-2000000,'s','Bhagiratha Brings Ganga to Earth','Gangotri','To free his ancestors, Bhagiratha did hard penance. Mahadev caught Ganga\'s force in his matted hair, and Mother Ganga came down to Earth.','गंगा','bhagirath ganga',"Bhagiratha"],
[-2000000,'r','Birth of Hanuman','Kishkindha / Anjaneri','Son of Kesari and Anjana, born by the blessing of Vayu, the child Hanuman leapt to swallow the sun thinking it a fruit.','हनुमान जन्म','hanuman janm',"Hanuman"],
[-1800000,'s','Vishwamitra Becomes a Brahmarshi','Kanyakubja','Defeated by Vasishtha, King Kaushika did penance for thousands of years. In the end Vasishtha himself called him Brahmarshi — he is the seer of the Gayatri Mantra.','गायत्री','vishwamitra gayatri',"Vishvamitra"],
[-1500000,'a','Parashurama Avatar','Narmada, Konkan','Parashurama, son of Jamadagni, destroyed the tyrant kings. Tradition says he raised the land of Konkan and Kerala from the sea.','परशुराम','parshuram',"Parashurama"],
[-1400000,'s','Sage Agastya Crosses the Vindhyas','Vindhya, Podhigai','Sage Agastya asked the ever-rising Vindhya mountain to bow and went south. He is honoured as the first teacher of South India\'s rishi tradition.','शिव','agastya',"Agastya"],
[-869200,'r','Birth of Shri Ram','Ayodhya','On Chaitra Shukla Navami, Lord Vishnu was born as Shri Ram to King Dasharatha and Mother Kaushalya. Ram Navami is celebrated on this day.','राम','ram janm ramnavami',"Rama"],
[-869190,'r','Rama Frees Ahalya','Gautama\'s ashram (Mithila)','Ahalya, frozen in penance under a curse, was freed the moment Shri Ram arrived.','अहल्या','ahalya uddhar',"Ahalya"],
[-869185,'r','Sita Swayamvar','Mithila','King Janaka\'s condition was to string Shiva\'s bow. When Shri Ram lifted it, the bow broke, and Mother Sita placed the wedding garland on him.','राम सीता','sita swayamvar vivah panchami',"Sita"],
[-869175,'r','Shri Ram\'s Exile','Ayodhya, Chitrakoot','Kaikeyi\'s two boons sent Ram into exile for fourteen years. Sita and Lakshmana went with him; Bharata ruled with Ram\'s sandals on the throne.','राम','vanvas chitrakoot',"Kaikeyi"],
[-869175,'r','The Ferryman Kevat','Shringverpur (Prayagraj)','Before ferrying the Lord across the Ganga, Kevat washed his feet; asked for payment, he said, carry me across the ocean of life.','केवट','kevat prasang',"Kevat"],
[-869172.8,'r','Chitrakoot and Kamadgiri','Chitrakoot (UP–MP)','Shri Ram spent much of his exile at Chitrakoot on the Mandakini; the circuit of Kamadgiri hill is believed to fulfil wishes.','चित्रकूट','chitrakoot kamadgiri',"Chitrakoot"],
[-869172,'r','Bharat Meets Rama: the Sandals','Chitrakoot','Bharat came to bring Rama back, returned with his sandals on his head, and ruled for fourteen years from Nandigram as a servant.','भरत मिलाप','bharat milap paduka',"Bharata (Ramayana)"],
[-869163.5,'r','Jatayu\'s Sacrifice','Panchavati / Lepakshi','The aged vulture-king Jatayu fought Ravana as he carried off Sita; Rama performed his last rites as a son would.','जटायु','jatayu balidan',"Jatayu"],
[-869163.2,'r','Shabari\'s Berries','Pampa lake (Matanga forest)','Shri Ram lovingly ate the berries Shabari had tasted for him after waiting for years on her guru\'s word.','शबरी','shabari ber',"Shabari"],
[-869163.1,'r','Rama Meets Hanuman; Friendship with Sugriva','Rishyamuka hill (Kishkindha)','Hanuman, disguised as a brahmin, recognised the Lord; with fire as witness, Rama and Sugriva became friends.','राम हनुमान मिलन','ram hanuman milan sugriv',"Sugriva"],
[-869163,'r','Sita Taken by Ravana','Panchavati (Nashik)','Using the trick of the golden deer to draw Ram and Lakshmana away, Ravana carried off Sita. Jatayu tried to stop him and died a hero\'s death.','राम','sita haran jatayu',"Jatayu"],
[-869162,'r','Hanuman\'s Leap to Lanka','Lanka','Hanuman leapt across the ocean, gave Ram\'s ring to Mother Sita in the Ashoka Vatika, and set Lanka on fire.','हनुमान','hanuman lanka',"Hanuman"],
[-869161,'r','Building of Ram Setu','Rameswaram','Led by Nala and Nila, the vanara army built a bridge over the sea with stones marked with Ram\'s name. At Rameswaram, Shri Ram installed a Shivalinga.','राम','ram setu rameshwaram',"Nala (Ramayana)"],
[-869161,'r','Lakshmana Revived by the Sanjivani','Lanka / Dronagiri','When Lakshmana fell to Meghnad\'s weapon, Hanuman carried back a whole mountain and the Sanjivani herb saved him.','संजीवनी','lakshman shakti sanjivani',"Sanjivani (Ramayana)"],
[-869160,'r','The End of Ravana','Lanka','After a fierce war, Shri Ram killed Ravana. This victory of dharma over adharma is celebrated on Dussehra.','राम','ravan dussehra',"Ravana"],
[-869159,'r','Shri Ram\'s Return and Ram Rajya','Ayodhya','When Shri Ram returned to Ayodhya after the exile, the people lit lamps — the tradition of Deepavali. His reign is remembered as the ideal Ram Rajya.','राम','diwali ram rajya',"Diwali"],
[-869159,'r','Lava and Kusha','Valmiki\'s ashram','Born at Valmiki\'s ashram, Sita\'s sons Lava and Kusha sang the Ramayana before their father Shri Ram at his ashvamedha.','लव कुश','lav kush',"Lava and Kusha"],
[-869150,'s','Valmiki Composes the Ramayana','Tamasa river','Grief at a krauncha bird\'s death brought the first shloka from the lips of Adikavi Valmiki. He went on to compose the Ramayana of 24,000 shlokas.','राम','valmiki ramayan',"Valmiki"],
[-867102,'c','Beginning of Dvapara Yuga','Bharatvarsha','Dharma now stood on two legs. This is the age of Shri Krishna and the Mahabharata.','कृष्ण','dwapar yug',"Dvapara Yuga"],
[-500000,'v','Emperor Bharata — the Name "Bharat"','Hastinapur region','Emperor Bharata was the son of Dushyanta and Shakuntala. By tradition the land is called "Bharatvarsha" after him.','विष्णु','bharat shakuntala',"Shakuntala"],
[-400000,'v','King Kuru and Kurukshetra','Kurukshetra','King Kuru tilled this land with penance and dharma, so it is called Dharmakshetra Kurukshetra. The Kuru dynasty began with him.','गीता','kuru kurukshetra',"Kurukshetra"],
[-3300,'s','Birth of Ved Vyasa','Yamuna','Krishna Dvaipayana, son of Sage Parashara and Satyavati, was born on an island in the Yamuna. He later divided the Vedas and composed the Mahabharata.','व्यास','vyas guru purnima',"Vyasa"],
[-3250,'m','Bhishma\'s Vow','Hastinapur','For his father Shantanu\'s happiness, Devavrata vowed lifelong celibacy and gave up the throne — from then on he was called "Bhishma".','महाभारत','bhishma pratigya',"Bhishma"],
[-3228,'k','Birth of Shri Krishna','Mathura','At midnight on Bhadrapada Krishna Ashtami, Shri Krishna appeared to Devaki and Vasudeva in Kamsa\'s prison. Vasudeva carried him across the Yamuna to Gokul.','कृष्ण','krishna janm janmashtami',"Krishna Janmashtami"],
[-3227,'k','Putana and the Butter Thief','Gokul','The infant Krishna ended the demoness Putana; growing up, he stole butter from every home in Gokul.','माखन चोर','putana makhan chor',"Putana"],
[-3225,'k','The Leelas of Vrindavan','Vrindavan','Stealing butter, taming Kaliya, lifting Govardhan and the Maha Raas — the leelas of Braj made Kanha the darling of every heart.','कृष्ण','vrindavan leela govardhan',"Radha Krishna"],
[-3224,'k','Krishna Subdues Kaliya','Vrindavan (Kalidah)','Dancing on the hoods of the serpent Kaliya, who had poisoned the Yamuna, young Krishna forced him to leave the river.','कालिय दमन','kaliya daman',"Kaliya"],
[-3223,'k','Krishna Lifts Govardhan','Govardhan (Braj)','To shield Braj from Indra\'s storm, Krishna held up Govardhan hill on one finger for seven days.','गोवर्धन पूजा','govardhan leela',"Govardhan Hill"],
[-3217,'k','Shri Krishna Ends Kamsa','Mathura','At the bow festival in Mathura, the young Krishna killed Kamsa and freed his parents and Ugrasena from prison.','कृष्ण','kans vadh',"Kamsa"],
[-3215,'k','Studies at Sandipani Ashram','Ujjain','In Ujjain, Krishna and Balarama learned the 64 arts from Guru Sandipani in 64 days; here Krishna became friends with Sudama.','कृष्ण','sandipani sudama',"Sudama"],
[-3200,'k','Founding of Dwarka','Dwarka','To protect his people from Jarasandha\'s repeated attacks, Shri Krishna built the golden city of Dwarka on the seashore.','द्वारकाधीश','dwarka',"Dwarka"],
[-3199,'k','Krishna and Rukmini','Kundinapura (Vidarbha)','Betrothed against her will to Shishupala, Rukmini wrote to Krishna, who carried her away from the temple in his chariot.','रुक्मिणी','rukmini haran',"Rukmini"],
[-3190,'k','Sudama Meets Krishna','Dwarka','Poor Sudama reached Dwarka with a handful of rice; without being asked, Krishna filled his home with wealth.','सुदामा','sudama milan',"Sudama"],
[-3180,'m','Ekalavya\'s Guru-Dakshina','Kuru forest (Hastinapur)','Ekalavya learnt archery before a clay image of Drona and gave his thumb as the teacher\'s fee.','एकलव्य','eklavya guru dakshina',"Ekalavya"],
[-3170,'m','Draupadi Swayamvar','Kampilya','Disguised as a brahmin, Arjuna pierced the eye of the spinning fish and won Draupadi.','महाभारत','draupadi arjun',"Draupadi"],
[-3160,'m','Indraprastha and the Rajasuya Yajna','Indraprastha','The Pandavas turned Khandavaprastha into Indraprastha. At Yudhishthira\'s Rajasuya yajna, Shri Krishna received the first worship.','कृष्ण','indraprastha rajsuya',"Rajasuya"],
[-3152,'m','The Dice Game and Draupadi\'s Honour','Hastinapur','Through Shakuni\'s deceit the Pandavas lost everything. In the full assembly, Shri Krishna saved Draupadi\'s honour with an endless sari.','कृष्ण','chirharan draupadi',"Shakuni"],
[-3141,'m','Yaksha\'s Questions to Yudhishthira','Dvaitavana','At a lake, a yaksha put questions to the thirsty Pandavas; Yudhishthira\'s answers of dharma revived his four brothers.','यक्ष प्रश्न','yaksha prashna',"Yaksha Prashna"],
[-3140,'sh','Arjuna Receives the Pashupatastra','Indrakila','During the exile, Arjuna did penance to Mahadev. Shiva tested him in the guise of a hunter (Kirata), then, pleased, gave him the Pashupatastra.','शिव','pashupatastra kirat',"Pashupatastra"],
[-3139,'k','Shri Krishna as the Messenger of Peace','Hastinapur','To avert war, Shri Krishna asked for just five villages for the Pandavas. Duryodhana refused to give even land the size of a needle\'s point.','कृष्ण','shanti doot',"Udyoga Parva"],
[-3138.5,'m','Karna Gives Away His Armour','Hastinapur','Knowing the brahmin was Indra in disguise, Karna cut off his god-given armour and earrings and gave them away.','कर्ण','karna kavach kundal',"Karna"],
[-3138,'k','The Teaching of the Bhagavad Gita','Kurukshetra','To Arjuna, lost in doubt, Shri Krishna taught karma, jnana and bhakti and showed his Vishvarupa. Gita Jayanti falls on Margashirsha Shukla Ekadashi.','गीता','gita updesh geeta jayanti',"Bhagavad Gita"],
[-3137.95,'m','Abhimanyu and the Chakravyuha','Kurukshetra','Sixteen-year-old Abhimanyu broke into the Chakravyuha alone and fell fighting many great warriors at once.','अभिमन्यु','abhimanyu chakravyuh',"Abhimanyu"],
[-3137.92,'m','Bhishma Teaches the Vishnu Sahasranama','Kurukshetra','Lying on the bed of arrows, Bhishma taught Yudhishthira the hymn of Vishnu\'s thousand names.','विष्णु सहस्रनाम','vishnu sahasranama bhishma',"Vishnu Sahasranama"],
[-3137.9,'m','The Mahabharata War','Kurukshetra','Eighteen days, eighteen akshauhini armies. The Kauravas fell and dharma was restored.','महाभारत','mahabharat yudh',"Kurukshetra War"],
[-3137.8,'m','Bhishma on the Bed of Arrows','Kurukshetra','Blessed to choose his time of death, Bhishma waited on a bed of arrows for Uttarayana and taught Yudhishthira dharma and the Vishnu Sahasranama.','विष्णु सहस्रनाम','bhishma sahasranam',"Vishnu Sahasranama"],
[-3137,'m','Coronation of Yudhishthira','Hastinapur','After the war Yudhishthira became king and performed the Ashvamedha yajna.','महाभारत','yudhishthir',"Yudhishthira"],
[-3103,'k','The End of the Yadavas','Prabhas','Cursed by sages, the Yadavas fought among themselves at Prabhas and perished.','कृष्ण','yadav',"Mausala Parva"],
[-3102.1,'k','Shri Krishna Returns to His Abode','Prabhas (Somnath)','After a hunter\'s arrow struck his foot, Shri Krishna ended his earthly leela. The spot is known today as Bhalka Tirth.','कृष्ण','bhalka tirth',"Somnath temple"],
[-3102,'c','Beginning of Kali Yuga','Bharatvarsha','Kali Yuga began as Shri Krishna departed. Dharma now stands on one leg, but in this age chanting the Lord\'s name is held to be the greatest path.','हरि नाम','kalyug',"Kali Yuga"],
[-3101,'m','The Pandavas\' Final Journey','Himalaya','Handing the kingdom to Parikshit, the Pandavas walked toward the Himalaya. Only Yudhishthira reached heaven in his body.','महाभारत','pandav swarg',"Mahaprasthanika Parva"],
[-3090,'s','Ved Vyasa Divides the Vedas','Badrikashram','Vyasa divided the Veda into four — Rig, Yajur, Sama and Atharva — and gave each to a disciple.','व्यास','ved vyas',"Vedas"],
[-3080,'s','Shukadeva Recites the Bhagavata to Parikshit','Shukratal','Knowing he would die in seven days, King Parikshit heard the Shrimad Bhagavatam from Shukadeva on the bank of the Ganga — the origin of the Bhagavata Saptah tradition.','भागवत','bhagwat katha shukdev',"Bhagavata Purana"],
[-3070,'v','Janamejaya\'s Snake Sacrifice','Takshashila','To avenge his father Parikshit, Janamejaya held a snake sacrifice; Sage Astika had it stopped. The Mahabharata was first recited at this sacrifice.','महाभारत','janmejay',"Janamejaya"],
[-3060,'s','Suta\'s Katha at Naimisharanya','Naimisharanya','At Naimisharanya, Suta told the Puranas to Shaunaka and the other rishis — most Puranas open with this very dialogue.','सत्यनारायण','naimisharanya sut',"Naimisharanya"],
[-1500,'s','The Rigveda','Sapta Sindhu','The seer-families of the land of seven rivers composed 1,028 hymns to Agni, Indra and Soma: humanity\'s oldest living scripture.','ऋग्वेद','rigveda',"Rigveda"],
[-700,'s','Yajnavalkya and Maitreyi','Videha (Mithila)','As Yajnavalkya divided his wealth before renouncing, Maitreyi asked instead for the knowledge of immortality.','याज्ञवल्क्य','yajnavalkya maitreyi',"Maitreyi"],
[-400,'t','Gokarna Mahabaleshwar','Gokarna (Karnataka)','Ganesha, as a boy, set down the Atmalinga here to keep it from Ravana; Gokarna also appears in the Mahabharata\'s tirtha list.','गोकर्ण','gokarna mahabaleshwar',"Mahabaleshwar Temple, Gokarna"],
[-400,'t','Gangasagar and Kapil Muni\'s Ashram','Sagar Island (West Bengal)','Where the Ganga meets the sea, King Sagara\'s sixty thousand sons were freed; at Makar Sankranti India\'s great bathing fair gathers here.','गंगासागर','gangasagar kapil muni',"Gangasagar"],
[-400,'u','Chhath Mahaparv','Bihar and Purvanchal','A four-day vow to the Sun: standing in water to offer arghya to the setting and rising sun, the great folk festival of Bihar and Purvanchal.','छठ पूजा','chhath mahaparv',"Chhath"],
[-57,'t','Har Ki Pauri, Haridwar','Haridwar (Uttarakhand)','By tradition King Vikramaditya built this ghat on the Ganga in memory of his brother Bhartrihari. The Brahmakund is here.','गंगा','har ki pauri',"Har Ki Pauri"],
[1,'s','The Yoga Sutra of Patanjali','North India','In 195 aphorisms Maharshi Patanjali defined yoga as the stilling of the mind and gave the eightfold path.','योगसूत्र','patanjali yoga sutra',"Yoga Sutras of Patanjali"],
[60,'t','Kanyakumari, the Virgin Goddess','Kanyakumari (Tamil Nadu)','At India\'s southern tip the Goddess Kumari waits in penance to wed Shiva; the 1st-century Greek Periplus already mentions pilgrims bathing here.','कन्याकुमारी','kanyakumari devi',"Kanyakumari Temple"],
[150,'t','Girnar and the Dattatreya Peak','Junagadh (Gujarat)','The sacred mountain of some 10,000 steps, with peaks of Ambaji, Gorakhnath and Dattatreya\'s footprints; a tirtha for Hindus and Jains.','गिरनार','girnar dattatreya',"Girnar"],
[200,'t','Dandayudhapani Murugan of Palani','Palani (Tamil Nadu)','Angered at losing the fruit of wisdom, young Murugan left Kailash and stands on Palani hill as an ascetic with a staff.','पलनी मुरुगन','palani murugan',"Palani Murugan Temple"],
[200,'t','Murugan of Tiruchendur','Tiruchendur (Tamil Nadu)','Murugan\'s only seaside abode, where he defeated the demon Surapadma; the Soorasamharam of Skanda Shashti is grandest here.','तिरुचेंदूर','tiruchendur murugan',"Tiruchendur Murugan Temple"],
[300,'u','Pongal and Makar Sankranti','All of India / Tamil Nadu','The festival of the sun turning north: Pongal in Tamil Nadu, Lohri in Punjab, Uttarayan in Gujarat, Magh Bihu in Assam, Khichdi in Bihar.','पोंगल','pongal makar sankranti',"Makar Sankranti"],
[400,'u','Mahashivaratri and Ekadashi Vows','All of India','The Puranas and Dharmashastras set out the night vigil of Mahashivaratri for Shiva and the Ekadashi fast for Vishnu, open to all.','शिवरात्रि','shivratri ekadashi vrat',"Maha Shivaratri"],

function AC(){if(!SND.c){try{SND.c=new(window.AudioContext||window.webkitAudioContext)();SND.m=SND.c.createGain();SND.m.gain.value=.9;
 const comp=SND.c.createDynamicsCompressor();SND.m.connect(comp).connect(SND.c.destination);
 // simple reverb
 const len=SND.c.sampleRate*2.6,b=SND.c.createBuffer(2,len,SND.c.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4)}

 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);out(g,.6);
 [[1,1],[2.0,.55],[2.74,.35],[4.07,.2],[5.43,.12],[.5,.25]].forEach(([r,a],j)=>{const o=c.createOscillator(),h=c.createGain();o.type='sine';o.frequency.value=f*r*(1+(j%2?.0025:-.0015));

function tick(){if(!SND.on||!SND.c)return;const n=performance.now();if(n-SND.lt<55)return;SND.lt=n;const c=SND.c,t=c.currentTime;

 const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=950+Math.random()*180;f.Q.value=4;const g=c.createGain();g.gain.value=.38;s.connect(f).connect(g);out(g,.1);s.start(t);
 try{navigator.vibrate&&navigator.vibrate(5)}catch(_){}}

 const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=5.2;lg.gain.value=2.2;lfo.connect(lg);lfo.start(t);lfo.stop(t+3.3);
 [[1,1],[2,.35],[3,.12]].forEach(([r,a])=>{const o=c.createOscillator(),h=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(220*r*.97,t);o.frequency.linearRampToValueAtTime(220*r,t+.45);lg.connect(o.frequency);h.gain.value=a;o.connect(h).connect(f);o.start(t);o.stop(t+3.3)})}
